<style>
/* Tokens generated from design-system/tokens.json. Dark-first: dark on bare :root. */
:root{--bg:#0b0910;--surface:#15111d;--surface-2:#1f1a2b;--ink:#eeeaf6;--muted:#a89fba;--line:#2e263d;--accent:#a78bfa;--accent-ink:#0b0910;--accent-soft:#2a1f47;--code-bg:#110e18;--think:#c4a5ff;--think-soft:#2e2150;--act:#f5b95c;--act-soft:#382810;--observe:#5eead4;--observe-soft:#0f2e2a;--final:#6ee7a0;--final-soft:#12301f;--bad:#ff8a8a;--bad-soft:#3a1719;--chain:#a78bfa;--chain-soft:#2a1f47;--graph:#f08be0;--graph-soft:#3a1736;--fuse:#5eead4;--fuse-soft:#0f2e2a;--ok:#6ee7a0;--ok-soft:#12301f;--warn:#f5b95c;--warn-soft:#382810;--p0:#ff8a8a;--p0-soft:#3a1719;--p1:#f5b95c;--p1-soft:#382810;--p2:#c4b5fd;--p2-soft:#29223f;--b1:#fdba74;--b1-soft:#3b2414;--shadow-pop:0 10px 30px rgba(0,0,0,.35);--shadow-dialog:0 24px 60px rgba(0,0,0,.45);--font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;--font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;--font-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;--radius-xs:4px;--radius-sm:6px;--radius-md:8px;--radius:10px;--radius-lg:12px;--radius-xl:14px;--radius-pill:999px;--space-4:4px;--space-6:6px;--space-8:8px;--space-12:12px;--space-14:14px;--space-16:16px;--space-18:18px;--space-24:24px;--space-28:28px;--space-40:40px;--space-56:56px;--page-max:1120px;--home-max:1080px;--measure:68ch;--topbar-height:56px;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f7f5fb;--surface:#ffffff;--surface-2:#eeeaf6;--ink:#110b1c;--muted:#5b5370;--line:#ddd6ea;--accent:#6d28d9;--accent-ink:#ffffff;--accent-soft:#ede5fd;--code-bg:#f1edf8;--think:#6d28d9;--think-soft:#ede5fd;--act:#9c5800;--act-soft:#fbeeda;--observe:#0f766e;--observe-soft:#d7f2ee;--final:#15803d;--final-soft:#dcf3e4;--bad:#b42318;--bad-soft:#fce7e4;--chain:#6d28d9;--chain-soft:#ede5fd;--graph:#a21caf;--graph-soft:#f8e3f8;--fuse:#0f766e;--fuse-soft:#d7f2ee;--ok:#15803d;--ok-soft:#dcf3e4;--warn:#9c5800;--warn-soft:#fbeeda;--p0:#b42318;--p0-soft:#fce7e4;--p1:#9c5800;--p1-soft:#fbeeda;--p2:#5b21b6;--p2-soft:#eae2fb;--b1:#c2410c;--b1-soft:#fdebdd;--shadow-pop:0 10px 30px rgba(10,20,40,.18);--shadow-dialog:0 24px 60px rgba(0,0,0,.45);color-scheme:light}}
:root[data-theme="light"]{--bg:#f7f5fb;--surface:#ffffff;--surface-2:#eeeaf6;--ink:#110b1c;--muted:#5b5370;--line:#ddd6ea;--accent:#6d28d9;--accent-ink:#ffffff;--accent-soft:#ede5fd;--code-bg:#f1edf8;--think:#6d28d9;--think-soft:#ede5fd;--act:#9c5800;--act-soft:#fbeeda;--observe:#0f766e;--observe-soft:#d7f2ee;--final:#15803d;--final-soft:#dcf3e4;--bad:#b42318;--bad-soft:#fce7e4;--chain:#6d28d9;--chain-soft:#ede5fd;--graph:#a21caf;--graph-soft:#f8e3f8;--fuse:#0f766e;--fuse-soft:#d7f2ee;--ok:#15803d;--ok-soft:#dcf3e4;--warn:#9c5800;--warn-soft:#fbeeda;--p0:#b42318;--p0-soft:#fce7e4;--p1:#9c5800;--p1-soft:#fbeeda;--p2:#5b21b6;--p2-soft:#eae2fb;--b1:#c2410c;--b1-soft:#fdebdd;--shadow-pop:0 10px 30px rgba(10,20,40,.18);--shadow-dialog:0 24px 60px rgba(0,0,0,.45);color-scheme:light}
:root[data-theme="dark"]{--bg:#0b0910;--surface:#15111d;--surface-2:#1f1a2b;--ink:#eeeaf6;--muted:#a89fba;--line:#2e263d;--accent:#a78bfa;--accent-ink:#0b0910;--accent-soft:#2a1f47;--code-bg:#110e18;--think:#c4a5ff;--think-soft:#2e2150;--act:#f5b95c;--act-soft:#382810;--observe:#5eead4;--observe-soft:#0f2e2a;--final:#6ee7a0;--final-soft:#12301f;--bad:#ff8a8a;--bad-soft:#3a1719;--chain:#a78bfa;--chain-soft:#2a1f47;--graph:#f08be0;--graph-soft:#3a1736;--fuse:#5eead4;--fuse-soft:#0f2e2a;--ok:#6ee7a0;--ok-soft:#12301f;--warn:#f5b95c;--warn-soft:#382810;--p0:#ff8a8a;--p0-soft:#3a1719;--p1:#f5b95c;--p1-soft:#382810;--p2:#c4b5fd;--p2-soft:#29223f;--b1:#fdba74;--b1-soft:#3b2414;--shadow-pop:0 10px 30px rgba(0,0,0,.35);--shadow-dialog:0 24px 60px rgba(0,0,0,.45);color-scheme:dark}
/* Agent Field Guides: component classes, copied from the module pages (how-ai-agents-work.html,
   index.html, metrics.html, langfuse.html, search.js, tool-links.js). Colours, fonts and radii
   come from tokens.css, whose --names match the guides' own custom properties. */

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-0.01em}
h3{font-size:1.25rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
code,.mono{font-family:var(--font-mono);font-size:.86em}
.muted{color:var(--muted)}
.small{font-size:.9rem}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.eyebrow{font-family:var(--font-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ds-pad{padding:16px;display:grid;gap:14px;align-content:start}
.ds-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-inline:16px}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.02rem;white-space:nowrap;text-decoration:none;color:var(--ink)}
.home-link{flex:none;font-size:.85rem;font-weight:700;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 11px;white-space:nowrap}
.home-link:hover{color:var(--accent);border-color:var(--accent)}
.stages{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding-block:8px}
.stages::-webkit-scrollbar{display:none}
.stages a{flex:none;text-decoration:none;color:var(--muted);font-size:.88rem;padding:5px 10px;border-radius:999px;white-space:nowrap}
.stages a .n{font-family:var(--font-mono);font-size:.75rem;margin-right:4px;opacity:.8}
.stages a:hover{color:var(--ink);background:var(--surface-2)}
.stages a.is-active{color:var(--accent-ink);background:var(--accent)}
.theme-btn{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.progress{height:3px;background:transparent;position:relative}
.progress span{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
.gs-btn{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 10px 5px 11px;font:inherit;font-size:.85rem;cursor:pointer}
.gs-btn:hover{color:var(--ink);border-color:var(--accent)}
.gs-btn svg{width:15px;height:15px;flex:none}
.gs-btn kbd{font-family:var(--font-mono);font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:1.4}

/* Next module */
.next-module{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.next-module a{font-family:var(--font-display);font-weight:700;font-size:1.1rem;text-decoration:none}

/* Buttons */
.btn{font:inherit;font-size:.92rem;font-weight:700;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover:not(:disabled){filter:brightness(1.08)}
.btn-sm{padding:5px 10px;font-size:.85rem}
.cta{justify-self:start;font-weight:700;font-size:.95rem;color:var(--accent-ink);background:var(--accent);padding:9px 16px;border-radius:8px;text-decoration:none}
.kbd{font-family:var(--font-mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}

/* Chips: filter suggestions */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lbl{font-size:.85rem;color:var(--muted);margin-right:2px}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* Tags */
.tag{display:inline-block;font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);justify-self:start}
.tag.accent{background:var(--accent-soft);color:var(--accent)}

/* Loop phases */
.kind{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;font-weight:500}
.k-think{background:var(--think-soft);color:var(--think)}
.k-call{background:var(--act-soft);color:var(--act)}
.k-res{background:var(--observe-soft);color:var(--observe)}
.k-final{background:var(--final-soft);color:var(--final)}
.k-bad{background:var(--bad-soft);color:var(--bad)}
.k-human{background:var(--accent-soft);color:var(--accent)}
.phases{display:flex;gap:4px;flex-wrap:wrap}
.phase{font-family:var(--font-mono);font-size:.75rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.phase.plan.is-on{background:var(--think-soft);color:var(--think);border-color:var(--think)}
.phase.act.is-on{background:var(--act-soft);color:var(--act);border-color:var(--act)}
.phase.observe.is-on{background:var(--observe-soft);color:var(--observe);border-color:var(--observe)}
.phase.finish.is-on{background:var(--final-soft);color:var(--final);border-color:var(--final)}

/* Priority (metrics module) */
.pb{display:inline-block;font-family:var(--font-mono);font-size:.72rem;font-weight:500;padding:1px 7px;border-radius:5px;letter-spacing:.04em;flex:none}
.pb.p0{background:var(--p0-soft);color:var(--p0)} .pb.p1{background:var(--p1-soft);color:var(--p1)} .pb.p2{background:var(--p2-soft);color:var(--p2)}
.prio{border-radius:var(--radius);padding:14px 16px;display:grid;gap:4px;border:1px solid var(--line);background:var(--surface);border-top:4px solid var(--c)}
.prio .pt{display:flex;gap:8px;align-items:center;font-family:var(--font-display);font-weight:800;font-size:1.15rem}
.prio p{font-size:.92rem;color:var(--muted)}
.prio .rule{font-family:var(--font-mono);font-size:.74rem;color:var(--c);letter-spacing:.04em}

/* Boxes and grids */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:8px;align-content:start;min-width:0}
.box.tint{background:var(--surface-2);border-color:transparent}
.box h4{font-size:1.05rem}
ul.clean{margin:0;padding-left:1.1em;display:grid;gap:4px}

/* Callout */
.callout{border:1px solid var(--line);background:var(--accent-soft);border-radius:var(--radius);padding:14px 16px;max-width:76ch}
.callout b{color:var(--accent)}

/* Takeaway */
.takeaway{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;border-top:2px solid var(--ink);padding-top:12px;max-width:86ch}
.takeaway .k{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.takeaway p{font-family:var(--font-display);font-weight:700;font-size:1.08rem;line-height:1.35}
.tips{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.tip{border-top:2px solid var(--ink);padding-top:10px;display:grid;gap:4px}
.tip b{font-family:var(--font-display);font-size:1.05rem}
.tip p{font-size:.95rem;color:var(--muted)}

/* Mistakes */
.mistakes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.mistake{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:10px;align-content:start}
.mistake .num{font-family:var(--font-display);font-weight:800;font-size:2rem;color:var(--bad);line-height:1}
.mistake dl{margin:0;display:grid;gap:8px;font-size:.93rem}
.mistake dt{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mistake dd{margin:0}

/* Check list */
.check-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.check-list li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.check-list .q{font-family:var(--font-mono);font-size:.8rem;border:1.5px solid var(--accent);color:var(--accent);border-radius:6px;width:24px;height:24px;display:grid;place-items:center;margin-top:2px}

/* Glossary term and popover */
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1.5px dotted var(--accent);line-height:inherit;text-align:inherit}
.term:hover,.term[aria-expanded="true"]{color:var(--accent)}
.term-pop{position:relative;z-index:50;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow-pop);font-size:.92rem;line-height:1.45;display:grid;gap:4px;max-width:340px}
.term-pop[hidden]{display:none}
.term-pop strong{font-family:var(--font-display)}

/* Tool links */
a.tool-link{white-space:nowrap;color:inherit;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-color:var(--accent)}
a.tool-link::after{content:"\2197";font-size:.68em;color:var(--accent);margin-left:.1em;vertical-align:.25em;text-decoration:none;display:inline-block}
a.tool-link:hover,a.tool-link:focus-visible{color:var(--accent);text-decoration-color:var(--accent)}
.tl-tip{position:relative;z-index:60;max-width:300px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow-pop);font-size:.86rem;line-height:1.4;display:grid;gap:3px}
.tl-tip b{font-family:var(--font-display)}
.tl-tip .tl-k{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.tl-tip .tl-d{color:var(--muted);font-size:.8rem;font-family:var(--font-mono);overflow-wrap:anywhere}

/* Tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.tablewrap table{border-collapse:collapse;width:100%;min-width:620px;font-size:.95rem}
.tablewrap th,.tablewrap td{text-align:left;vertical-align:top;padding:11px 14px;border-bottom:1px solid var(--line)}
.tablewrap th{font-family:var(--font-display);font-weight:700;background:var(--surface-2)}
.tablewrap tr:last-child td{border-bottom:0}
.tablewrap td:first-child{font-weight:700}
.yes{color:var(--final);font-weight:700}

/* Code */
pre.code{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 0;overflow-x:auto;font-family:var(--font-mono);font-size:.84rem;line-height:1.7}
pre.code .ln{display:block;padding:0 16px;border-left:3px solid transparent;white-space:pre}
pre.code .ln.is-on{background:var(--accent-soft);border-left-color:var(--accent)}
pre.code .c{color:var(--muted)}
pre.code .k{color:var(--think)}
pre.code .s{color:var(--observe)}
.codenow{font-family:var(--font-mono);font-size:.8rem;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--ink);overflow-x:auto;white-space:nowrap;min-width:0;max-width:100%}
.codenow .c{color:var(--muted)}
.call{font-family:var(--font-mono);font-size:.8rem;background:var(--code-bg);border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin:0}
.call .fn{color:var(--act);font-weight:500}
.call.bad .fn{color:var(--bad)}

/* Home module card */
.modules{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.module{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:14px;align-content:start;transition:border-color .15s, transform .15s}
.module:hover{border-color:var(--accent);transform:translateY(-2px)}
.module .num{font-family:var(--font-display);font-weight:800;font-size:3rem;line-height:.9;color:var(--accent)}
.module h2{font-size:clamp(1.4rem,3vw,1.75rem);font-weight:750}
.module h2 a{color:inherit;text-decoration:none}
.module h2 a::after{content:"";position:absolute;inset:0;border-radius:12px}
.module .sum{color:var(--muted)}
.module ul{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:.95rem}
.module .chips .chip{font-family:var(--font-mono);font-size:.76rem;padding:3px 10px;border-radius:999px;font-weight:500;border:0;cursor:default}
.c-plan{background:var(--think-soft);color:var(--think)}
.c-act{background:var(--act-soft);color:var(--act)}
.c-obs{background:var(--observe-soft);color:var(--observe)}
.c-chain{background:var(--accent-soft);color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--font-mono);font-size:.78rem;color:var(--muted)}

/* Quiz */
.quiz{background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:18px;display:grid;gap:12px;max-width:820px}
.quiz-label{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.quiz-q{font-weight:700;font-size:1.05rem}
.quiz-opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:26px 1fr;gap:8px}
.opt .l{font-family:var(--font-mono);font-weight:500;color:var(--muted)}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--final);background:var(--final-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.quiz-fb{font-size:.95rem}
.quiz-fb:empty{display:none}

/* Demo console */
.demo{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.sim-banner{display:flex;gap:10px;align-items:flex-start;background:var(--act-soft);color:var(--ink);padding:10px 16px;font-size:.92rem;border-bottom:1px solid var(--line)}
.sim-banner b{color:var(--act)}
.statusbar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-family:var(--font-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.statusbar b{color:var(--ink);font-weight:500}
.step{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;gap:8px;background:var(--surface);min-width:0}
.step-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.step-n{font-family:var(--font-mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.step-t{font-weight:700;font-size:.95rem}
.step .thought{font-style:italic;color:var(--ink);font-size:.95rem}
.step.s-think{background:var(--think-soft);border-color:transparent}
.step.s-final{border-color:var(--final);border-width:1.5px}
.step.s-halt{border-color:var(--bad);border-width:1.5px}
.step.s-bad{border-color:var(--bad)}
.extract{border-left:3px solid var(--observe);padding-left:10px}
.log{padding:10px 16px;overflow:auto;font-family:var(--font-mono);font-size:.74rem;line-height:1.55;background:var(--code-bg)}
.log div{white-space:pre-wrap;word-break:break-word}
.log .t{color:var(--muted)}
.log .e-model{color:var(--think)} .log .e-tool{color:var(--act)} .log .e-res{color:var(--observe)} .log .e-run{color:var(--final)} .log .e-bad{color:var(--bad)} .log .e-human{color:var(--accent)}

/* Metric tiles */
.calc-out{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.metric{background:var(--surface-2);border-radius:8px;padding:12px;display:grid;gap:2px}
.metric .v{font-family:var(--font-mono);font-size:1.25rem;font-variant-numeric:tabular-nums;font-weight:500}
.metric .k{font-size:.82rem;color:var(--muted)}
.metric.warn .v{color:var(--bad)}

/* Trace summary (Langfuse module) */
.trace-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.trace-sum div{background:var(--surface);padding:8px 10px;display:grid;min-width:0}
.trace-sum .v{font-family:var(--font-mono);font-size:.95rem;font-variant-numeric:tabular-nums;font-weight:500}
.trace-sum .k{font-size:.72rem;color:var(--muted)}

/* Diagrams */
figure{margin:0;display:grid;gap:8px}
figure .diagram{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;color:var(--ink)}
figure svg{display:block;width:100%;height:auto;max-width:760px;margin:0 auto}
figcaption{font-size:.92rem;color:var(--muted);max-width:70ch}
svg text{font-family:var(--font-body)}
svg .node rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
svg .node text{fill:var(--ink)}
svg .node .sub{fill:var(--muted);font-size:11.5px}
svg .ttl{font-family:var(--font-display);font-weight:700;font-size:15px}
svg .edge{stroke:var(--muted);stroke-width:1.5;fill:none}
svg .edge-dash{stroke:var(--bad);stroke-width:1.5;fill:none;stroke-dasharray:5 5}
svg .lbl{fill:var(--muted);font-size:12px}
svg .lbl-bad{fill:var(--bad);font-size:12px}
svg .arrowhead{fill:var(--muted)}
svg .node.plan.is-on rect{fill:var(--think-soft);stroke:var(--think);stroke-width:2.5}
svg .node.act.is-on rect{fill:var(--act-soft);stroke:var(--act);stroke-width:2.5}
svg .node.observe.is-on rect{fill:var(--observe-soft);stroke:var(--observe);stroke-width:2.5}
svg .node.finish.is-on rect{fill:var(--final-soft);stroke:var(--final);stroke-width:2.5}

/* Search dialog (search.js) */
.gs-box{width:100%;max-width:680px;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-dialog);overflow:hidden}
.gs-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.gs-top svg{width:18px;height:18px;color:var(--muted);flex:none}
.gs-in{flex:1;min-width:0;font:inherit;font-size:1.05rem;background:transparent;color:var(--ink);border:0;outline:none;padding:4px 0}
.gs-x{flex:none;font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:6px;padding:3px 8px;cursor:pointer}
.gs-meta{padding:8px 16px;font-size:.78rem;color:var(--muted);font-family:var(--font-mono);border-bottom:1px solid var(--line)}
.gs-list{list-style:none;margin:0;padding:6px;overflow-y:auto;flex:1}
.gs-list li{margin:0}
.gs-list a{display:grid;gap:3px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink)}
.gs-list li[aria-selected="true"] a{background:var(--accent-soft);outline:1.5px solid var(--accent)}
.gs-where{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.gs-h{font-family:var(--font-display);font-weight:700;font-size:.98rem;line-height:1.3}
.gs-h span{font-weight:400;color:var(--muted)}
.gs-snip{font-size:.86rem;color:var(--muted);line-height:1.45}
.gs-list mark{background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:0 1px;box-shadow:inset 0 -2px 0 var(--accent)}
.gs-foot{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 16px;border-top:1px solid var(--line);font-size:.75rem;color:var(--muted)}
.gs-foot kbd{font-family:var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:0 4px}

/* ---- Page layer: layout and the few pieces the design system does not ship ----
   Layout: one 1120px column per module; a two-row sticky top bar (module tabs, then the
   section rail); stage sections stacked with a hairline above each. */
html{scroll-padding-top:128px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);overflow-x:hidden}
.wrap{max-width:var(--page-max);margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.prose{max-width:var(--measure);display:grid;gap:12px}
.prose p,.box p{min-width:0}
strong{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bad-t{color:var(--bad);font-weight:700}

/* Top bar */
.topbar{top:env(safe-area-inset-top, 0px);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.topbar-in{min-height:52px}
.brand{flex:none}
.modtabs{display:flex;gap:2px;background:var(--surface-2);border-radius:999px;padding:3px;margin-left:auto;min-width:0}
.modtab{font:inherit;font-size:.88rem;font-weight:700;border:1.5px solid transparent;background:transparent;color:var(--muted);border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.modtab .n{font-family:var(--font-mono);font-size:.74rem;font-weight:500;margin-right:5px;opacity:.85}
.modtab:hover{color:var(--ink)}
.modtab[aria-selected="true"]{background:var(--surface);color:var(--accent);border-color:var(--accent)}
.railrow{min-height:0;border-top:1px solid var(--line);gap:10px}
.stages a .rd{font-family:var(--font-mono);font-size:.7rem;margin-left:5px;color:var(--final)}
.stages a.is-active .rd{color:var(--accent-ink)}
.railcount{flex:none;font-family:var(--font-mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:640px){
  .brand{display:none}
  .modtabs{margin-left:0;flex:1}
  .modtab{flex:1;padding:4px 6px}
  .railcount .long{display:none}
}

/* Module hero and sections */
.panel[hidden]{display:none}
.hero{padding-block:48px 40px;display:grid;gap:14px}
.hero h1{font-size:clamp(2.1rem,5.5vw,3.4rem);font-weight:800;max-width:22ch}
.lede{font-size:1.15rem;color:var(--muted);max-width:62ch}
.lede strong{color:var(--ink)}
.hint{font-size:.92rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px}
.hint .term{cursor:default}
.sec{border-top:1px solid var(--line);padding-block:56px 8px;display:grid;gap:28px;min-width:0}
.sec-h{display:grid;gap:10px}
.sec-h h2{font-size:clamp(1.6rem,3.6vw,2.2rem);font-weight:750;max-width:30ch}
.intro{font-size:1.05rem;color:var(--muted);max-width:64ch}
.sec > *{min-width:0}
h3.sub{font-size:1.25rem;margin-top:4px}
.foot{padding-block:40px 56px;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line);margin-top:56px}
.foot p{max-width:80ch}

/* Stage anatomy */
.owners{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.owners .eyebrow{margin-right:2px}
.owners .eyebrow + .tag{margin-left:0}
.owners .gap{width:10px}
.ex{background:var(--surface-2);border-radius:var(--radius);padding:18px;display:grid;gap:10px}
.ex .tag{background:var(--surface)}
.wrong{background:var(--surface);border:1.5px solid var(--bad);border-radius:var(--radius);padding:18px;display:grid;gap:10px}
.wrong-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wrong-h b{font-family:var(--font-display);font-size:1.05rem}
.wrong dl,.dl{margin:0;display:grid;gap:8px;font-size:.95rem}
.wrong dt,.dl dt{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.wrong dd,.dl dd{margin:0}
.box .out{display:flex;flex-wrap:wrap;gap:6px}

/* Interactive maps: SDLC wheel and ADLC loop */
.mapper{display:grid;gap:14px;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
@media (max-width:980px){.mapper{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.mapper figure svg[aria-label^="SDLC"]{min-width:420px}.mapper figure svg[aria-label^="ADLC"]{min-width:560px}}
.mapper figure .diagram{padding:8px}
.mapper figure svg{max-width:560px}
svg .seg path{fill:var(--surface-2);stroke:var(--bg);stroke-width:3;transition:fill .15s}
svg .seg text{fill:var(--ink);font-family:var(--font-display);font-weight:700;font-size:15px;pointer-events:none}
svg .seg .num{font-family:var(--font-mono);font-weight:500;font-size:12px;fill:var(--muted)}
svg .seg{cursor:pointer;outline:none}
svg .seg:hover path{fill:var(--accent-soft)}
svg .seg.is-sel path{fill:var(--accent)}
svg .seg.is-sel text,svg .seg.is-sel .num{fill:var(--accent-ink)}
svg .seg.is-bad path{fill:var(--bad)}
svg .seg.is-bad text,svg .seg.is-bad .num{fill:var(--bg)}
svg .seg:focus-visible path{stroke:var(--accent);stroke-width:3}
svg .hub{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
svg .hub-t{fill:var(--ink);font-family:var(--font-display);font-weight:800;font-size:26px}
svg .hub-s{fill:var(--muted);font-size:12.5px}
svg .node{cursor:pointer;outline:none}
svg .node:hover rect{stroke:var(--accent)}
svg .node.is-sel rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5}
svg .node.is-bad rect{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2.5}
svg .node:focus-visible rect{stroke:var(--accent);stroke-width:3}
svg .node .ttl{font-size:16px}
svg .node .sub{font-size:12.5px}
svg .node .nn{font-family:var(--font-mono);font-size:11.5px;fill:var(--muted)}
svg .edge-back{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:6 5}
svg .arrow-accent{fill:var(--accent)}
svg .lbl-accent{fill:var(--accent);font-size:12.5px;font-family:var(--font-mono)}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:18px;display:grid;gap:12px;min-width:0}
.detail.is-bad{border-color:var(--bad);border-width:1.5px}
.detail h3{font-size:1.35rem}
.detail-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.switch{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:.9rem;font-weight:700;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer}
.switch:hover{border-color:var(--accent)}
.switch .knob{width:30px;height:18px;border-radius:999px;background:var(--surface-2);border:1.5px solid var(--line);position:relative;flex:none}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-pressed="true"]{border-color:var(--bad)}
.switch[aria-pressed="true"] .knob{background:var(--bad-soft);border-color:var(--bad)}
.switch[aria-pressed="true"] .knob::after{transform:translateX(12px);background:var(--bad)}
.detail .log{border-radius:var(--radius);border:1px solid var(--line)}
.detail a.more{font-weight:700;text-decoration:none}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Simulated trace console */
.demo-head{padding:14px 16px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.ask{display:grid;gap:4px}
.ask .who{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ask q{font-family:var(--font-display);font-weight:700;font-size:1.1rem;line-height:1.3;quotes:"\201C" "\201D"}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls .grow{flex:1}
.demo-body{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);min-height:420px;max-height:600px}
.side .log{overflow-y:auto}
.timeline{padding:14px 16px;display:grid;gap:12px;align-content:start;border-right:1px solid var(--line);min-width:0;max-height:600px;overflow-y:auto}
.step.s-still{animation:none}
.side{display:grid;grid-template-rows:auto auto auto auto auto minmax(0,1fr);gap:0;min-width:0;min-height:0}
.wf-host{padding:0 16px 12px}
.wf-host .demo-empty{padding:0}
details.tbl summary{cursor:pointer;font-size:.9rem;color:var(--accent);font-weight:700;margin-bottom:8px}
.tracks{gap:56px}
@media (max-width:640px){.tracks{gap:30px}}
.side .pane-h{padding:10px 16px 6px;font-family:var(--font-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.side .trace-sum{margin:0 16px 12px}
.side .log{border-top:1px solid var(--line);min-height:160px}
.demo-empty{color:var(--muted);font-size:.95rem;padding:6px 0}
.step{animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.step .call{max-width:100%;overflow-x:auto}
.step.s-current{outline:2px solid var(--accent);outline-offset:2px}
.answer{display:grid;gap:8px;font-size:.95rem}
.answer ul{margin:0;padding-left:1.1em;display:grid;gap:3px}
.disclaimer{font-size:.84rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
@media (max-width:860px){
  .demo-body{grid-template-columns:minmax(0,1fr)}
  .demo-body{max-height:none}
  .timeline{border-right:0;border-bottom:1px solid var(--line);max-height:480px}
  .side .log{max-height:240px}
}
@media (max-width:520px){.trace-sum{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Quiz set */
.quizset{display:grid;gap:14px}
.quiz-score{font-family:var(--font-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.quiz-score b{color:var(--ink);font-weight:500}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.7}
.quiz-fb b{font-family:var(--font-display)}

/* Cheat sheet */
.cheat{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius-xl);padding:22px;display:grid;gap:22px}
.cheat-head{display:grid;gap:6px;border-bottom:1px solid var(--line);padding-bottom:16px}
.formula{font-family:var(--font-display);font-weight:700;font-size:1.25rem;line-height:1.3}
.formula em{font-style:normal;color:var(--accent)}
.cheat-grid{display:grid;gap:18px 22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.cheat-block{display:grid;gap:8px;align-content:start;min-width:0}
.cheat-block h4{font-size:1rem;border-top:2px solid var(--ink);padding-top:8px}
.cheat-block ol,.cheat-block ul{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:.93rem}
.cheat-block li::marker{font-family:var(--font-mono);color:var(--muted)}
.terms-list{margin:0;display:grid;gap:10px 22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));font-size:.9rem}
.terms-list div{min-width:0}
.terms-list dt{font-family:var(--font-display);font-weight:700}
.terms-list dd{margin:0;color:var(--muted)}
details.terms{border-top:1px solid var(--line);padding-top:14px}
details.terms summary{cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:1.05rem}
details.terms summary span{font-family:var(--font-mono);font-weight:400;font-size:.8rem;color:var(--muted);margin-left:6px}
details.terms[open] summary{margin-bottom:14px}

/* Glossary popover */
#termPop{position:absolute;max-width:min(340px, calc(100vw - 32px))}
#termPop .x{justify-self:end;font:inherit;font-size:.78rem;background:none;border:0;color:var(--muted);cursor:pointer;padding:0;text-decoration:underline}

/* Comparison: parallel tracks */
.tracks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.track{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.track-h{display:grid;gap:2px;margin-bottom:4px}
.track-h b{font-family:var(--font-display);font-size:1.1rem}
.track-h span{font-size:.85rem;color:var(--muted)}
.tstage{font:inherit;text-align:left;display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:center;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;font-size:.93rem;font-weight:700;min-width:0}
.tstage .n{font-family:var(--font-mono);font-size:.75rem;font-weight:500;color:var(--muted)}
.tstage:hover{border-color:var(--accent)}
.tstage.is-sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tstage.is-sel .n{color:var(--accent-ink)}
.tstage.is-match{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tstage.is-match .n{color:var(--accent)}
.tnote{background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--radius-xl);padding:18px;display:grid;gap:8px}
.tnote .pair{font-family:var(--font-mono);font-size:.78rem;color:var(--accent);letter-spacing:.04em}
.tnote h3{font-size:1.2rem}

/* Comparison table columns and before/after */
.tablewrap td .eg{display:block;margin-top:4px;color:var(--muted);font-size:.88rem}
.ba{display:grid;gap:6px;font-size:.93rem}
.ba .was{color:var(--muted)}
.ba .now b{color:var(--accent)}
.crit{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.crit .box q{font-style:italic;quotes:"\201C" "\201D"}

/* Decision guide scenarios */
.scen{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:12px;align-content:start;min-width:0}
.scen p.s{font-size:.98rem}
.scen .opts{display:flex;flex-wrap:wrap;gap:6px}
.scen .opts .chip[aria-pressed="true"].ok{background:var(--final-soft);border-color:var(--final);color:var(--final)}
.scen .opts .chip[aria-pressed="true"].no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.scen .verdict{font-size:.93rem;display:grid;gap:6px}
.scen .verdict:empty{display:none}

/* Next module bar */
.next-module{margin-top:40px}
.next-module button{font:inherit;font-family:var(--font-display);font-weight:700;font-size:1.1rem;color:var(--accent);background:none;border:0;cursor:pointer;padding:0;text-align:left}

/* Small figures */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.prio-row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.prio.p0c{--c:var(--p0)} .prio.p1c{--c:var(--p1)} .prio.p2c{--c:var(--p2)}
.sprint{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;font-family:var(--font-mono);font-size:.7rem;color:var(--muted)}
.sprint div{background:var(--surface-2);border-radius:6px;padding:6px 4px;display:grid;gap:3px;text-align:center;min-width:0}
.sprint div b{font-weight:500;color:var(--ink)}

/* ==== Visuals (src/visuals.js). Colours come only from tokens. ==== */
.vc-think{--c:var(--think);--cs:var(--think-soft)}
.vc-observe{--c:var(--observe);--cs:var(--observe-soft)}
.vc-act{--c:var(--act);--cs:var(--act-soft)}
.vc-graph{--c:var(--graph);--cs:var(--graph-soft)}
.vc-final{--c:var(--final);--cs:var(--final-soft)}
.vc-bad{--c:var(--bad);--cs:var(--bad-soft)}
.vc-accent{--c:var(--accent);--cs:var(--accent-soft)}
.vc-p2{--c:var(--p2);--cs:var(--p2-soft)}
.vc-muted{--c:var(--muted);--cs:var(--surface-2)}
.sk-think{stroke:var(--think)} .sk-observe{stroke:var(--observe)} .sk-act{stroke:var(--act)} .sk-graph{stroke:var(--graph)} .sk-final{stroke:var(--final)} .sk-bad{stroke:var(--bad)} .sk-accent{stroke:var(--accent)} .sk-muted{stroke:var(--muted)}
.fk-think{fill:var(--think)} .fk-observe{fill:var(--observe)} .fk-act{fill:var(--act)} .fk-graph{fill:var(--graph)} .fk-final{fill:var(--final)} .fk-bad{fill:var(--bad)} .fk-accent{fill:var(--accent)} .fk-muted{fill:var(--muted)} .fk-ink{fill:var(--ink)}

.fig{margin:0;display:grid;gap:8px;min-width:0}
.fig-body{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:14px;min-width:0}
.fig-title{font-family:var(--font-display);font-weight:700;font-size:1rem}
.fig figcaption{font-size:.9rem;color:var(--muted);max-width:76ch}
.fig figcaption .tag{margin-right:4px}
.ex .fig-body{background:var(--surface)}
.figs{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}

/* SVG text and marks */
.vs-grid{stroke:var(--line);stroke-width:1}
.vs-ax{fill:var(--muted);font-family:var(--font-mono);font-size:12px}
.vs-ml{font-family:var(--font-mono);font-size:11.5px}
.vs-val{fill:var(--ink);font-family:var(--font-mono);font-size:12.5px;font-weight:500}
.vs-thr{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:6 5;fill:none}
.vs-mark{stroke-width:1.5;stroke-dasharray:3 4;fill:none}
.vs-series{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.vs-series.is-dash{stroke-dasharray:5 4;stroke-width:2}
.vs-dot{stroke:var(--surface);stroke-width:2}
.v-line{display:block;width:100%;height:auto}
.vs-frame{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.vs-card{fill:var(--surface-2)}
.vs-h{fill:var(--ink);font-family:var(--font-display);font-weight:700;font-size:15px}
.vs-t{fill:var(--ink);font-size:11.5px}
.vs-m{fill:var(--muted);font-size:10.5px}
.vs-v{fill:var(--ink);font-family:var(--font-mono);font-weight:500;font-size:17px}
.vs-donut{fill:none;stroke-width:9}
.vs-bad{fill:var(--bad-soft);stroke:var(--bad);stroke-width:1.5;stroke-dasharray:4 3;opacity:.85}
.vs-badt{fill:var(--bad);font-family:var(--font-mono);font-size:11px}
.v-wire{display:block;width:100%;height:auto;margin:0 auto}

/* Horizontal bars */
.v-hb{display:grid;gap:8px}
.v-hb-row{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr) minmax(4.5rem,auto);gap:12px;align-items:center;font-size:.92rem}
.v-hb-l{min-width:0}
.v-hb-track{position:relative;height:16px;border-radius:4px;background:transparent}
.v-hb-track i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--c)}
.v-hb-v{font-family:var(--font-mono);font-size:.84rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.has-thr .v-hb-track::after{content:"";position:absolute;top:-4px;bottom:-4px;left:var(--thr);border-left:1.5px dashed var(--ink)}
.v-hb-head .v-hb-track{height:auto}
.v-hb-head .v-hb-track::after{display:none}
.v-hb-head b{position:relative;left:var(--thr);display:inline-block;transform:translateX(-50%);font-family:var(--font-mono);font-size:.74rem;font-weight:500;color:var(--ink);white-space:nowrap}
@media (max-width:600px){
  .v-hb-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l v" "t t";gap:4px 10px}
  .v-hb-l{grid-area:l}.v-hb-v{grid-area:v}.v-hb-track{grid-area:t}
  .v-hb-head{grid-template-areas:"t t"}.v-hb-head > span:not(.v-hb-track){display:none}
  .v-hb-head b{transform:translateX(-80%)}
}

/* Dot ranges */
.v-dr{display:grid;gap:10px}
.v-dr-scale,.v-dr-row{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr);gap:12px;align-items:center}
.v-dr-axis{position:relative;height:18px;font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
.v-dr-axis span{position:absolute;top:0}.v-dr-axis span:first-child{left:0}.v-dr-axis span:last-child{right:0}
.v-dr-axis b{position:absolute;top:0;left:var(--thr);transform:translateX(-100%);padding-right:6px;font-weight:500;color:var(--ink);white-space:nowrap}
.v-dr-l{font-size:.92rem}
.v-dr-row{margin:6px 0 26px}
.v-dr-track{position:relative;height:30px;border-bottom:1.5px solid var(--line)}
.v-dr-track::after{content:"";position:absolute;top:0;bottom:-4px;left:var(--thr);border-left:1.5px dashed var(--ink)}
.v-dr-track i{position:absolute;bottom:-7px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:var(--c);border:2px solid var(--surface)}
.v-dr-track i em{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--font-mono);font-size:.7rem;white-space:nowrap;color:var(--ink)}
.v-dr-track i em.is-below{bottom:auto;top:16px}
.v-dr-track i em.is-right{left:auto;right:-2px;transform:none}
@media (max-width:600px){.v-dr-row,.v-dr-scale{grid-template-columns:minmax(0,1fr)}.v-dr-scale > span:first-child{display:none}.v-dr-row{gap:24px;margin-bottom:22px}}

/* Stacked bar and legends */
.v-stack{display:grid;gap:12px}
.v-stack-bar{position:relative;display:flex;gap:2px;height:30px;border-radius:6px;overflow:visible}
.v-stack-bar i{display:block;height:100%;background:var(--c);min-width:3px}
.v-stack-bar i:first-child{border-radius:6px 0 0 6px}.v-stack-bar i:last-of-type{border-radius:0 6px 6px 0}
.v-stack-lim{position:absolute;top:-8px;bottom:-8px;left:var(--lim);border-left:2px dashed var(--ink)}
.v-stack-lim span{position:absolute;top:-18px;left:0;transform:translateX(-50%);font-family:var(--font-mono);font-size:.72rem;font-weight:500;white-space:nowrap}
.v-stack{padding-top:14px}
.is-over .v-stack-bar::after{content:"";position:absolute;inset:0 0 0 var(--lim);background:repeating-linear-gradient(135deg,transparent 0 6px,var(--bad-soft) 6px 10px);border:1.5px solid var(--bad);border-radius:0 6px 6px 0;pointer-events:none}
.v-legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.86rem}
.v-legend li{display:flex;align-items:center;gap:6px}
.v-legend li i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.v-legend li span{font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}
.v-legend-total{font-weight:700}

/* Waffle */
.v-waffle{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:3px;max-width:520px}
.v-waffle i{aspect-ratio:1;border-radius:2px;background:var(--c)}
.v-waffle + .v-legend{margin-top:-2px}

/* Timeline */
.v-tl{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;position:relative}
.v-tl li{display:grid;gap:4px;align-content:start;position:relative;font-size:.86rem;min-width:0}
.v-tl li::before{content:"";position:absolute;top:27px;left:0;right:-10px;border-top:2px solid var(--line)}
.v-tl li:last-child::before{right:0}
.v-tl-t{font-family:var(--font-mono);font-size:.74rem;color:var(--muted);white-space:nowrap}
.v-tl-dot{position:relative;z-index:1;width:14px;height:14px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-sizing:content-box;margin-left:-3px}
.v-tl b{font-family:var(--font-display);color:var(--c);font-size:.95rem}
.v-tl-x{color:var(--ink);overflow-wrap:anywhere}
@media (max-width:700px){
  .v-tl{grid-auto-flow:row;gap:12px;padding-left:4px}
  .v-tl li{grid-template-columns:20px minmax(0,1fr);column-gap:10px}
  .v-tl li::before{top:18px;bottom:-12px;left:9px;right:auto;border-top:0;border-left:2px solid var(--line)}
  .v-tl li:last-child::before{display:none}
  .v-tl-dot{grid-row:1 / span 3;grid-column:1;margin:2px 0 0}
  .v-tl-t,.v-tl b,.v-tl-x{grid-column:2}
}

/* Flow of boxes and arrows */
.v-flow{display:flex;align-items:stretch;gap:0;min-width:0}
.v-node{flex:1 1 0;min-width:0;border:1.5px solid var(--c);background:var(--cs);border-radius:var(--radius);padding:10px 12px;display:grid;gap:3px;align-content:start}
.v-node.vc-muted{border-color:var(--line);background:var(--surface-2)}
.v-node.is-dash{border-style:dashed}
.v-node b{font-family:var(--font-display);font-size:.95rem;line-height:1.25}
.v-node > span{font-size:.82rem;color:var(--muted);line-height:1.4}
.v-node-tag{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.v-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.v-chips em{font-style:normal;font-family:var(--font-mono);font-size:.7rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--ink)}
.v-edge{flex:0 0 74px;display:flex;align-items:center;justify-content:center;position:relative;padding:0 4px}
.v-edge::before{content:"";position:absolute;left:4px;right:9px;top:50%;border-top:2px solid var(--c)}
.v-edge.vc-muted::before{border-top-color:var(--muted)}
.v-edge::after{content:"";position:absolute;right:3px;top:50%;margin-top:-5px;border:5px solid transparent;border-left:7px solid var(--c);border-right:0}
.v-edge.vc-muted::after{border-left-color:var(--muted)}
.v-edge.is-dash::before{border-top-style:dashed}
.v-edge span{position:relative;top:-14px;font-family:var(--font-mono);font-size:.68rem;color:var(--muted);text-align:center;line-height:1.2;background:var(--surface);padding:0 2px}
.v-flow.is-vertical,.v-flow.is-vertical .v-edge{flex-direction:column}
@media (max-width:760px){
  .v-flow{flex-direction:column}
  .v-edge{flex:0 0 38px;justify-content:flex-start;padding-left:34px}
  .v-edge::before{left:18px;right:auto;top:2px;bottom:9px;border-top:0;border-left:2px solid var(--c)}
  .v-edge.vc-muted::before{border-left-color:var(--muted)}
  .v-edge.is-dash::before{border-left-style:dashed}
  .v-edge::after{left:14px;right:auto;top:auto;bottom:2px;margin:0;border:5px solid transparent;border-top:7px solid var(--c);border-bottom:0}
  .v-edge.vc-muted::after{border-top-color:var(--muted);border-left-color:transparent}
  .v-edge span{top:0;background:none}
}

/* Pyramid */
.v-pyr{display:grid;gap:4px;justify-items:center}
.v-pyr-tier{width:var(--w);min-width:min(100%,220px);background:var(--cs);border:1.5px solid var(--c);border-radius:8px;padding:8px 12px;display:grid;gap:2px;text-align:center}
.v-pyr-tier b{font-family:var(--font-display);font-size:.98rem}
.v-pyr-tier span{font-family:var(--font-mono);font-size:.74rem;color:var(--muted)}

/* Swimlane */
.v-sw{display:grid;gap:6px}
.v-sw-head,.v-sw-row{display:grid;grid-template-columns:minmax(5.5rem,9rem) minmax(0,1fr);gap:10px;align-items:center}
.v-sw-head{grid-template-columns:minmax(5.5rem,9rem) repeat(var(--n),minmax(0,1fr));gap:0 10px;font-size:.74rem;color:var(--muted)}
.v-sw-head span:not(:first-child){display:grid;gap:1px;text-align:center;min-width:0}
.v-sw-head b{font-family:var(--font-mono);font-weight:500;color:var(--ink)}
.v-sw-head em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-sw-t{font-weight:700;font-size:.9rem}
.v-sw-lane{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:30px;column-gap:0;position:relative}
.v-sw-lane i{grid-row:1;border-left:1px solid var(--line)}
.v-sw-lane i:last-of-type{border-right:1px solid var(--line)}
.v-sw-bar{grid-row:1;z-index:1;margin:3px 4px;font:inherit;font-family:var(--font-mono);font-size:.7rem;color:var(--ink);background:var(--cs);border:1.5px solid var(--c);border-radius:999px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.v-sw-bar:hover,.v-sw-bar[aria-pressed="true"]{background:var(--c);color:var(--bg)}
.v-sw-lane i:nth-of-type(1){grid-column:1}.v-sw-lane i:nth-of-type(2){grid-column:2}.v-sw-lane i:nth-of-type(3){grid-column:3}.v-sw-lane i:nth-of-type(4){grid-column:4}.v-sw-lane i:nth-of-type(5){grid-column:5}.v-sw-lane i:nth-of-type(6){grid-column:6}.v-sw-lane i:nth-of-type(7){grid-column:7}.v-sw-lane i:nth-of-type(8){grid-column:8}
.v-note{font-size:.92rem;background:var(--surface-2);border-radius:8px;padding:10px 12px;margin:6px 0 0}
.v-note b{font-family:var(--font-display)}
@media (max-width:640px){.v-sw-head em{display:none}.v-sw-bar{font-size:0;padding:0}.v-sw-head,.v-sw-row{grid-template-columns:5.5rem minmax(0,1fr)}.v-sw-head{grid-template-columns:5.5rem repeat(var(--n),minmax(0,1fr));gap:0}}

/* Risk matrix */
.v-rm{display:grid;gap:14px}
.v-rm-grid{display:grid;grid-template-columns:auto auto repeat(3,minmax(0,1fr));gap:4px;align-items:stretch}
.v-rm-axis-y{grid-row:1 / span 3;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--font-mono);font-size:.72rem;color:var(--muted);text-align:center}
.v-rm-y{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);align-self:center;text-align:right;padding-right:4px}
.v-rm-x{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);text-align:center}
.v-rm-axis-x{grid-column:3 / span 3;font-family:var(--font-mono);font-size:.72rem;color:var(--muted);text-align:center}
.v-rm-cell{min-height:78px;border-radius:8px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-content:center;justify-content:center}
.sev-0,.sev-1{background:var(--surface-2)}.sev-2{background:var(--act-soft)}.sev-3,.sev-4{background:var(--bad-soft)}
.v-rm-item{font:inherit;font-size:.78rem;font-weight:700;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer}
.v-rm-item:hover,.v-rm-item[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.v-rm-note{background:var(--surface-2);border-radius:8px;padding:12px 14px;display:grid;gap:6px;font-size:.93rem}
.v-rm-note h4{font-size:1rem}

/* Histogram */
.v-hist{display:grid;gap:6px}
.v-hist-plot{position:relative;display:flex;align-items:flex-end;gap:3px;height:150px;border-bottom:1.5px solid var(--line);padding-top:26px}
.v-hist-col{flex:1;height:100%;display:flex;align-items:flex-end}
.v-hist-col i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--accent);opacity:.85}
.v-hist-col.vc-bad i{background:var(--bad)}
.v-hist-m{position:absolute;top:0;bottom:0;border-left:2px dashed var(--c)}
.v-hist-m span{position:absolute;top:0;left:5px;font-family:var(--font-mono);font-size:.72rem;font-weight:500;color:var(--ink);white-space:nowrap;background:var(--surface);padding:0 3px}
.v-hist-x{display:flex;gap:3px}
.v-hist-x span{flex:1;text-align:center;font-family:var(--font-mono);font-size:.68rem;color:var(--muted);min-width:0;overflow:hidden}
.v-hist-u{font-size:.8rem;color:var(--muted);text-align:center}

/* Waterfall */
.v-wf{display:grid;gap:4px}
.v-wf-row{display:grid;grid-template-columns:minmax(0,9.5rem) minmax(0,1fr);gap:10px;align-items:center;font-size:.8rem}
.v-wf-l{font-family:var(--font-mono);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-wf-track{position:relative;height:14px}
.v-wf-track i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--c)}
.v-wf-axis .v-wf-track{height:16px;border-top:1px solid var(--line)}
.v-wf-axis em{position:absolute;top:2px;transform:translateX(-50%);font-style:normal;font-family:var(--font-mono);font-size:.66rem;color:var(--muted)}
.v-wf-axis em:first-child{transform:none}
.v-wf-axis em:last-child{transform:translateX(-100%)}

/* Ribbon: where you are */
.v-rib{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.v-rib li{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;background:var(--surface-2);color:var(--muted);font-size:.78rem;min-width:0}
.v-rib li b{font-family:var(--font-mono);font-weight:500;font-size:.72rem}
.v-rib li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-rib li.is-past{background:var(--accent-soft);color:var(--accent)}
.v-rib li.is-cur{background:var(--accent);color:var(--accent-ink);font-weight:700}
@media (max-width:760px){.v-rib li:not(.is-cur) span{display:none}.v-rib li{justify-content:center}.v-rib li.is-cur{grid-column:span 3;justify-content:flex-start}}

/* Gauges */
.v-gauge{display:grid;grid-template-columns:minmax(0,7rem) minmax(0,1fr) minmax(5.5rem,auto);gap:10px;align-items:center;font-size:.88rem}
.v-gauge-t{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.v-gauge-t i{display:block;height:100%;background:var(--final);border-radius:999px}
.v-gauge.is-bad .v-gauge-t i{background:var(--bad)}
.v-gauge-v{font-family:var(--font-mono);font-size:.8rem;text-align:right}
.v-gauge.is-bad .v-gauge-v{color:var(--bad);font-weight:500}

/* Toggle views */
.v-tg{display:grid;gap:12px}
.v-tg-btns{display:flex;flex-wrap:wrap;gap:6px}
.v-tg-btns .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Decision ladder */
.v-lad{display:grid;gap:0}
.v-lad-row{display:grid;grid-template-columns:minmax(0,1.3fr) 56px minmax(0,1fr);align-items:center}
.v-lad-q,.v-lad-out{border-radius:var(--radius);padding:10px 12px;display:grid;gap:2px;transition:background .2s,border-color .2s}
.v-lad-q{background:var(--surface-2);border:1.5px solid var(--line)}
.v-lad-out{background:var(--cs);border:1.5px solid var(--c)}
.v-lad-out:only-child{grid-column:1}
.v-lad-k{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.v-lad b{font-family:var(--font-display);font-size:.95rem;line-height:1.3}
.v-lad-yes,.v-lad-no{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);position:relative;text-align:center}
.v-lad-yes::before{content:"";display:block;border-top:2px solid var(--line);margin:0 6px 2px}
.v-lad-no{display:block;width:max-content;margin-left:22px;padding:6px 0 6px 12px;border-left:2px solid var(--line)}
.v-lad [data-node].is-on{border-color:var(--accent);color:var(--accent)}
.v-lad .v-lad-q.is-on{background:var(--accent-soft)}
.v-lad .v-lad-out.is-on{outline:2.5px solid var(--accent);outline-offset:2px}
.v-lad .v-lad-yes.is-on::before{border-top-color:var(--accent)}
.v-lad .v-lad-no.is-on{border-left-color:var(--accent);color:var(--accent)}
@media (max-width:640px){.v-lad-row{grid-template-columns:minmax(0,1fr)}.v-lad-yes{text-align:left;padding:4px 0 4px 34px}.v-lad-yes::before{position:absolute;left:22px;top:0;bottom:0;border-top:0;border-left:2px solid var(--line);margin:0}.v-lad .v-lad-yes.is-on::before{border-left-color:var(--accent)}}

/* Mini lifecycles */
.v-minis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.v-mini{display:grid;gap:4px;justify-items:center;text-align:center}
.v-mini-svg{width:100%;max-width:220px}

.v-mini span{font-size:.86rem;color:var(--muted);max-width:30ch}

.fan{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
