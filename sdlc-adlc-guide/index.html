<script>
/* Markup helpers. Content files call these to build sections from the design system's
   component classes. Text may mark a glossary term as [[key]] or [[key|shown text]]. */
"use strict";
const MODULES = [];

const p = (...ps) => ps.map(x => `<p>${x}</p>`).join("");
const prose = (...ps) => `<div class="prose">${p(...ps)}</div>`;
const ul = items => `<ul class="clean">${items.map(i => `<li>${i}</li>`).join("")}</ul>`;
const tag = (t, accent) => `<span class="tag${accent ? " accent" : ""}">${t}</span>`;
const grid = (n, items) => `<div class="grid g${n}">${items.join("")}</div>`;
const sub = t => `<h3 class="sub">${t}</h3>`;

function box(title, body, o = {}) {
  return `<div class="box${o.tint ? " tint" : ""}">${o.tag ? tag(o.tag, o.accent) : ""}${title ? `<h4>${title}</h4>` : ""}${body}</div>`;
}
function callout(lead, text) {
  return `<div class="callout"><b>${lead}</b> ${text}</div>`;
}
/* rows: arrays of cells; a cell may be {v, cls} */
function table(head, rows, caption) {
  const cell = (c, tagName) => {
    if (c && typeof c === "object") return `<${tagName} class="${c.cls || ""}">${c.v}</${tagName}>`;
    return `<${tagName}>${c}</${tagName}>`;
  };
  return `<div class="tablewrap"><table>${caption ? `<caption class="sr">${caption}</caption>` : ""}<thead><tr>${head.map(h => `<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => cell(c, "td")).join("")}</tr>`).join("")}</tbody></table></div>`;
}
/* lines: [time, eventClass, eventName, rest] */
function log(lines) {
  return `<div class="log" role="log">${lines.map(([t, c, e, rest]) => `<div><span class="t">${t}</span>  <span class="${c}">${e}</span>${rest ? "  " + rest : ""}</div>`).join("")}</div>`;
}
/* lines are pre-escaped HTML; use <span class="c|k|s"> for comment, keyword, string */
function code(lines, label) {
  return `<pre class="code"${label ? ` aria-label="${label}"` : ""}>${lines.map(l => `<span class="ln">${l || " "}</span>`).join("")}</pre>`;
}
function checklist(items) {
  return `<ul class="check-list">${items.map((t, i) => `<li><span class="q">${i + 1}</span><span>${t}</span></li>`).join("")}</ul>`;
}
function dl(pairs) {
  return `<dl class="dl">${pairs.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
}
function mistakes(list) {
  return `<div class="mistakes">${list.map((m, i) => `<div class="mistake"><div class="num">${i + 1}</div><h4>${m.title}</h4>${m.habit ? `<p class="habit"><b>SDLC habit</b><span>${m.habit[0]}</span><span aria-hidden="true">→</span><span class="bad">breaks</span><span>${m.habit[1]}</span></p>` : ""}<dl><dt>What it looks like</dt><dd>${m.looks}</dd><dt>Why it hurts</dt><dd>${m.why}</dd><dt>Fix</dt><dd>${m.fix}</dd></dl></div>`).join("")}</div>`;
}
function metrics(list) {
  return `<div class="kv">${list.map(([v, k, warn]) => `<div class="metric${warn ? " warn" : ""}"><span class="v">${v}</span><span class="k">${k}</span></div>`).join("")}</div>`;
}

/* A lifecycle stage, rendered with the same six parts every time: where it sits in the
   lifecycle, who owns it, the running example (with its visual), what happens, what the
   PM does, what it produces, and what goes wrong drawn as an incident timeline. */
function stageBody(s, exampleName, i, all, lifecycle) {
  const owners = `<div class="owners"><span class="eyebrow">Owner</span>${s.owner.map(o => tag(o, true)).join("")}<span class="gap"></span><span class="eyebrow">With</span>${s.with.map(o => tag(o)).join("")}</div>`;
  return [
    ribbon(all.map(x => x.short || x.name), i, lifecycle),
    owners,
    `<div class="ex">${tag("Running example · " + exampleName)}${p(...s.example)}${s.visual ? s.visual() : ""}</div>`,
    grid(3, [
      box("What happens", p(...s.what)),
      box("What the PM does", ul(s.pm)),
      box("What it produces", ul(s.output)),
    ]),
    s.extra || "",
    `<div class="wrong"><div class="wrong-h"><span class="kind k-bad">Goes wrong</span><b>${s.wrong.title}</b></div>${timeline(s.wrong.timeline)}${dl([["What happens", s.wrong.what], ["How the team catches it", s.wrong.caught]])}</div>`,
  ].join("");
}

/* questions: {q, opts: [], a: index, why} */
function quizSet(id, questions) {
  return `<div class="quizset" data-quiz="${id}"><div class="ring-wrap"><svg class="v-ring" viewBox="0 0 52 52" aria-hidden="true"><circle class="bg" cx="26" cy="26" r="22"></circle><circle class="fg" cx="26" cy="26" r="22" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"></circle></svg><p class="quiz-score" aria-live="polite">Answered <b data-n>0</b> of ${questions.length} · right <b data-r>0</b></p></div>${questions.map((x, qi) => `
    <div class="quiz" data-a="${x.a}"><span class="quiz-label">Check your understanding · Question ${qi + 1} of ${questions.length}</span>
    <p class="quiz-q" id="${id}-q${qi}">${x.q}</p>
    <div class="quiz-opts" role="group" aria-labelledby="${id}-q${qi}">${x.opts.map((o, oi) => `<button class="opt" type="button" data-i="${oi}"><span class="l">${"ABCD"[oi]}</span><span>${o}</span></button>`).join("")}</div>
    <p class="quiz-fb" aria-live="polite" data-why="${x.why.replace(/"/g, "&quot;")}"></p></div>`).join("")}</div>`;
}

/* sheet: {title, formula, blocks: [{h, items, ordered}], checks: {h, items}} */
function cheatSheet(sh) {
  const block = b => `<div class="cheat-block"><h4>${b.h}</h4>${b.ordered ? `<ol>${b.items.map(i => `<li>${i}</li>`).join("")}</ol>` : `<ul>${b.items.map(i => `<li>${i}</li>`).join("")}</ul>`}</div>`;
  return `<div class="cheat"><div class="cheat-head"><span class="eyebrow">${sh.eyebrow}</span><h3>${sh.title}</h3><p class="formula">${sh.formula}</p></div>${sh.visual ? sh.visual() : ""}
    <div class="cheat-grid">${sh.blocks.map(block).join("")}</div>
    ${sh.checks ? `<div class="cheat-block"><h4>${sh.checks.h}</h4>${checklist(sh.checks.items)}</div>` : ""}
    <details class="terms"><summary>Every term in this module<span data-termcount></span></summary><dl class="terms-list" data-termlist></dl></details></div>`;
}

/* Visual builders. Each returns markup coloured only through design-system tokens.
   HTML/CSS is used wherever a visual must reflow on phones (bars, flows, timelines,
   grids); SVG for shapes that need geometry (lines, donuts, wireframes, the venn).
   Kinds name a token: think, observe, act, graph, final, bad, accent, muted, p2.
   When several kinds sit side by side as categories, use that order: it is the one
   that passed the colour-separation check. Every visual also carries words, so colour
   is never the only signal. */
const NS = "http://www.w3.org/2000/svg";
const f1 = n => n.toFixed(1);
const VC = k => `vc-${k || "muted"}`;
const LOGKIND = { "e-model": "think", "e-tool": "act", "e-res": "observe", "e-run": "final", "e-bad": "bad", "e-human": "accent" };
const ACRONYMS = { prd: "PRD", qa: "QA", pm: "PM", pr: "PR", ci: "CI", rm: "RM", p95: "p95" };
const pretty = s => s.split("_").map(w => ACRONYMS[w.toLowerCase()] || w).join(" ").replace(/^[a-z]/, c => c.toUpperCase());
const attr = s => String(s).replace(/<[^>]+>/g, "").replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, a, b) => b || a).replace(/"/g, "&quot;");
const pct = (v, max) => (Math.max(0, Math.min(1, v / max)) * 100).toFixed(2) + "%";

/* A figure with a caption. o: {interactive, illustrative, title, cls, label} */
function fig(body, caption, o = {}) {
  const role = o.interactive ? 'role="group"' : 'role="img"';
  return `<figure class="fig${o.cls ? " " + o.cls : ""}"><div class="fig-body" ${role} aria-label="${attr(o.label || caption)}">${o.title ? `<p class="fig-title">${o.title}</p>` : ""}${body}</div><figcaption>${o.illustrative ? '<span class="tag">Illustrative</span> ' : ""}${caption}</figcaption></figure>`;
}

/* Horizontal bars. rows: {l, v, d (shown value), k}. o: {max, thr: {v, label}} */
function hbars(rows, o = {}) {
  const max = o.max || Math.max(...rows.map(r => r.v));
  const thr = o.thr ? ` style="--thr:${pct(o.thr.v, max)}"` : "";
  const head = o.thr ? `<div class="v-hb-row v-hb-head"><span></span><span class="v-hb-track"><b>${o.thr.label}</b></span><span></span></div>` : "";
  return `<div class="v-hb${o.thr ? " has-thr" : ""}"${thr}>${head}${rows.map(r => `<div class="v-hb-row ${VC(r.k)}" title="${attr(r.l)}: ${attr(r.d ?? r.v)}"><span class="v-hb-l">${r.l}</span><span class="v-hb-track"><i style="width:${pct(Math.max(r.v, max * 0.006), max)}"></i></span><span class="v-hb-v">${r.d ?? r.v}</span></div>`).join("")}</div>`;
}

/* Dots on a scale, for comparing versions against a threshold. rows: {l, pts: [{v, k, l}]} */
function dotRange(rows, o) {
  const frac = v => (v - o.min) / (o.max - o.min);
  const pos = v => pct(v - o.min, o.max - o.min);
  /* Points with the same value share one label; labels near the right edge hang leftwards. */
  const dots = r => r.pts.map((pt, j) => {
    const same = r.pts.filter(q => q.v === pt.v);
    if (same.length > 1 && same[0] !== pt) return `<i class="${VC(pt.k)}" style="left:${pos(pt.v)}"></i>`;
    const label = same.length > 1 ? `${same.map(q => q.l).join(" and ")} ${o.fmt(pt.v)}` : `${pt.l} ${o.fmt(pt.v)}`;
    return `<i class="${VC(pt.k)}" style="left:${pos(pt.v)}" title="${attr(label)}"><em class="${j ? "is-below" : ""}${frac(pt.v) > 0.8 ? " is-right" : ""}">${label}</em></i>`;
  }).join("");
  return `<div class="v-dr" style="--thr:${pos(o.thr)}"><div class="v-dr-scale"><span></span><span class="v-dr-axis"><span>${o.fmt(o.min)}</span><b>${o.thrLabel} ${o.fmt(o.thr)}</b><span>${o.fmt(o.max)}</span></span></div>${rows.map(r => `
    <div class="v-dr-row"><span class="v-dr-l">${r.l}</span><span class="v-dr-track">${dots(r)}</span></div>`).join("")}</div>`;
}

/* One bar split into parts, with an optional capacity. parts: {l, v, k}. o: {limit, limitLabel, unit} */
function stack(parts, o = {}) {
  const total = parts.reduce((a, p) => a + p.v, 0);
  const scale = Math.max(total, o.limit || 0) * (o.limit && total > o.limit ? 1 : 1.0);
  const over = o.limit && total > o.limit;
  return `<div class="v-stack${over ? " is-over" : ""}">
    <div class="v-stack-bar"${o.limit ? ` style="--lim:${pct(o.limit, scale)}"` : ""}>${parts.map(p => `<i class="${VC(p.k)}" style="width:${pct(p.v, scale)}" title="${attr(p.l)}: ${p.v.toLocaleString("en-US")}${o.unit || ""}"></i>`).join("")}${o.limit ? `<b class="v-stack-lim"><span>${o.limitLabel}</span></b>` : ""}</div>
    <ul class="v-legend">${parts.map(p => `<li class="${VC(p.k)}"><i></i>${p.l}<span>${p.v.toLocaleString("en-US")}${o.unit || ""}</span></li>`).join("")}<li class="v-legend-total">Total<span>${total.toLocaleString("en-US")}${o.unit || ""}${o.limit ? ` of ${o.limit.toLocaleString("en-US")}` : ""}</span></li></ul></div>`;
}

/* One square per unit. groups: {l, n, k} */
function waffle(groups, cols = 20) {
  return `<div class="v-waffle" style="--cols:${cols}">${groups.map(g => Array.from({ length: g.n }, () => `<i class="${VC(g.k)}"></i>`).join("")).join("")}</div>
    <ul class="v-legend">${groups.map(g => `<li class="${VC(g.k)}"><i></i>${g.l}<span>${g.n}</span></li>`).join("")}</ul>`;
}

/* A run of events, left to right on wide screens and top to bottom on phones.
   events: [time, logClass, event_name, text] (the same rows the event logs use) */
function timeline(events) {
  return `<ol class="v-tl">${events.map(([t, c, name, text]) => `<li class="${VC(LOGKIND[c])}"><span class="v-tl-t">${t}</span><span class="v-tl-dot" aria-hidden="true"></span><b>${pretty(name)}</b><span class="v-tl-x">${text}</span></li>`).join("")}</ol>`;
}

/* Boxes joined by labelled arrows. nodes: {t, s, k, chips: []}; edges: label or {l, k, dash} */
function flow(nodes, edges = [], o = {}) {
  const node = n => `<div class="v-node ${VC(n.k)}${n.dash ? " is-dash" : ""}">${n.tag ? `<span class="v-node-tag">${n.tag}</span>` : ""}<b>${n.t}</b>${n.s ? `<span>${n.s}</span>` : ""}${n.chips ? `<span class="v-chips">${n.chips.map(c => `<em>${c}</em>`).join("")}</span>` : ""}</div>`;
  const edge = e => { const x = typeof e === "object" ? e : { l: e }; return `<div class="v-edge ${VC(x.k)}${x.dash ? " is-dash" : ""}" aria-hidden="${x.l ? "false" : "true"}"><span>${x.l || ""}</span></div>`; };
  return `<div class="v-flow${o.vertical ? " is-vertical" : ""}">${nodes.map((n, i) => node(n) + (i < nodes.length - 1 ? edge(edges[i] || "") : "")).join("")}</div>`;
}

/* Stacked tiers, narrow at the top. tiers: {t, meta, k} from top to bottom */
function pyramid(tiers) {
  return `<div class="v-pyr">${tiers.map((t, i) => `<div class="v-pyr-tier ${VC(t.k)}" style="--w:${40 + (60 * i) / (tiers.length - 1)}%"><b>${t.t}</b><span>${t.meta}</span></div>`).join("")}</div>`;
}

/* Which tool is used across which stages. rows: {t, from, to, k, note} (stage indexes) */
function swimlane(stages, rows, id) {
  const n = stages.length;
  return `<div class="v-sw" data-swim="${id}" style="--n:${n}">
    <div class="v-sw-head"><span></span>${stages.map((s, i) => `<span title="${attr(s)}"><b>${i + 1}</b><em>${s}</em></span>`).join("")}</div>
    ${rows.map((r, i) => `<div class="v-sw-row"><span class="v-sw-t">${r.t}</span><span class="v-sw-lane">${stages.map(() => "<i></i>").join("")}<button type="button" class="v-sw-bar ${VC(r.k)}" style="grid-column:${r.from + 1} / ${r.to + 2}" data-i="${i}" aria-pressed="false">${stages.slice(r.from, r.to + 1).length > 1 ? `${stages[r.from]} → ${stages[r.to]}` : stages[r.from]}</button></span></div>`).join("")}
    <p class="v-note" aria-live="polite" data-notes="${attr(JSON.stringify(rows.map(r => [r.t, r.note])))}">Tap a tool to see what you'll do in it as PM.</p></div>`;
}

/* Likelihood × impact heatmap. items: {t, l, i, before, after} with l and i from 0 (low) to 2 (high) */
function riskMatrix(items, id) {
  const lv = ["Low", "Medium", "High"];
  let cells = "";
  for (let l = 2; l >= 0; l--) {
    cells += `<span class="v-rm-y">${lv[l]}</span>`;
    for (let i = 0; i <= 2; i++) {
      const here = items.map((x, j) => ({ ...x, j })).filter(x => x.l === l && x.i === i);
      cells += `<div class="v-rm-cell sev-${l + i}">${here.map(x => `<button type="button" class="v-rm-item" data-j="${x.j}" aria-pressed="false">${x.t}</button>`).join("")}</div>`;
    }
  }
  return `<div class="v-rm" data-risk="${id}" data-items="${attr(JSON.stringify(items))}">
    <div class="v-rm-grid"><span class="v-rm-axis-y">Likelihood</span>${cells}<span></span><span></span>${lv.map(x => `<span class="v-rm-x">${x}</span>`).join("")}<span class="v-rm-axis-x">Impact on clients and the bank</span></div>
    <div class="v-rm-note" aria-live="polite"><p class="muted">Tap a risk to see how it's caught before and after launch.</p></div></div>`;
}

/* A line chart. o: {x: labels, series: [{v, k, l}], y: {min, max, ticks, fmt}, goal: {v, l}, marks: [{i, l, k}], step} */
function lineChart(o) {
  const W = 520, H = o.h || 230, L = 46, R = 22, T = 22, B = 34;
  const n = o.x.length;
  const X = i => L + (i * (W - L - R)) / Math.max(n - 1, 1);
  const Y = v => T + (1 - (v - o.y.min) / (o.y.max - o.y.min)) * (H - T - B);
  const fmt = o.y.fmt || (v => v);
  let svg = "";
  o.y.ticks.forEach(t => { svg += `<line class="vs-grid" x1="${L}" x2="${W - R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"></line><text class="vs-ax" x="${L - 8}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end">${fmt(t)}</text>`; });
  o.x.forEach((l, i) => { if (l) svg += `<text class="vs-ax" x="${X(i).toFixed(1)}" y="${H - 12}" text-anchor="middle">${l}</text>`; });
  (o.marks || []).forEach(m => { svg += `<line class="vs-mark sk-${m.k || "muted"}" x1="${X(m.i).toFixed(1)}" x2="${X(m.i).toFixed(1)}" y1="${T - 6}" y2="${H - B}"></line><text class="vs-ml fk-${m.k || "muted"}" x="${(X(m.i) + (m.left ? -5 : 5)).toFixed(1)}" y="${T + 4}" text-anchor="${m.left ? "end" : "start"}">${m.l}</text>`; });
  if (o.goal) svg += `<line class="vs-thr" x1="${L}" x2="${W - R}" y1="${Y(o.goal.v).toFixed(1)}" y2="${Y(o.goal.v).toFixed(1)}"></line><text class="vs-ml fk-ink" x="${W - R}" y="${(Y(o.goal.v) - 6).toFixed(1)}" text-anchor="end">${o.goal.l}</text>`;
  o.series.forEach(s => {
    let d = "", pen = false, prev = null;
    s.v.forEach((v, i) => {
      if (v === null) { pen = false; return; }
      if (!pen) d += `M${X(i).toFixed(1)} ${Y(v).toFixed(1)}`;
      else if (o.step) d += `H${X(i).toFixed(1)}V${Y(v).toFixed(1)}`;
      else d += `L${X(i).toFixed(1)} ${Y(v).toFixed(1)}`;
      pen = true; prev = v;
    });
    svg += `<path class="vs-series sk-${s.k}" d="${d}"></path>`;
    s.v.forEach((v, i) => { if (v !== null) svg += `<circle class="vs-dot fk-${s.k}" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4"><title>${attr(o.x[i] || "")} · ${s.l}: ${fmt(v)}</title></circle>`; });
    (s.labels || []).forEach(([i, text, above]) => { svg += `<text class="vs-val" x="${X(i).toFixed(1)}" y="${(Y(s.v[i]) + (above === false ? 18 : -10)).toFixed(1)}" text-anchor="middle">${text}</text>`; });
  });
  return `<svg class="v-line" viewBox="0 0 ${W} ${H}" aria-hidden="true">${svg}</svg>`;
}

/* Columns of counts. bins: {l, n}; markers: {at (bin units from the left), l, k} */
function histogram(bins, o = {}) {
  const max = Math.max(...bins.map(b => b.n));
  return `<div class="v-hist"><div class="v-hist-plot">${bins.map(b => `<span class="v-hist-col${b.k ? " " + VC(b.k) : ""}" title="${attr(b.l)}: ${b.n}%"><i style="height:${pct(b.n, max)}"></i></span>`).join("")}
    ${(o.markers || []).map(m => `<b class="v-hist-m ${VC(m.k)}" style="left:${pct(m.at, bins.length)}"><span>${m.l}</span></b>`).join("")}</div>
    <div class="v-hist-x">${bins.map(b => `<span>${b.l}</span>`).join("")}</div>${o.unit ? `<p class="v-hist-u">${o.unit}</p>` : ""}</div>`;
}

/* Spans on a time axis, like a trace view. spans: {l, s (start), d (duration), k} */
function waterfall(spans, total, ticks) {
  return `<div class="v-wf">${spans.map(sp => `<div class="v-wf-row ${VC(sp.k)}" title="${attr(sp.l)}: ${sp.d.toFixed(2)} s"><span class="v-wf-l">${sp.l}</span><span class="v-wf-track"><i style="left:${pct(sp.s, total)};width:${pct(Math.max(sp.d, total * 0.008), total)}"></i></span></div>`).join("")}
    <div class="v-wf-row v-wf-axis"><span></span><span class="v-wf-track">${ticks.map(t => `<em style="left:${pct(t, total)}">${t} s</em>`).join("")}</span></div></div>`;
}

/* Where you are in a lifecycle. names: stage names; cur: index */
function ribbon(names, cur, label) {
  return `<ol class="v-rib" aria-label="${attr(label)}: stage ${cur + 1} of ${names.length}">${names.map((n, i) => `<li class="${i < cur ? "is-past" : i === cur ? "is-cur" : ""}"${i === cur ? ' aria-current="step"' : ""}><b>${i + 1}</b><span>${n}</span></li>`).join("")}</ol>`;
}

/* A meter for a budget or limit */
function gauge(l, v, max, shown, bad) {
  return `<div class="v-gauge${bad ? " is-bad" : ""}"><span class="v-gauge-l">${l}</span><span class="v-gauge-t"><i style="width:${pct(v, max)}"></i></span><span class="v-gauge-v">${shown}</span></div>`;
}

/* Switch between views of the same figure. views: {label, html} */
function toggleViews(id, views) {
  return `<div class="v-tg" data-tg="${id}"><div class="v-tg-btns" role="group" aria-label="Choose a view">${views.map((v, i) => `<button type="button" class="chip" aria-pressed="${i === 0}" data-v="${i}">${v.label}</button>`).join("")}</div>
    ${views.map((v, i) => `<div class="v-tg-view" data-view="${i}"${i ? " hidden" : ""}>${v.html}</div>`).join("")}</div>`;
}

/* Yes/no questions read top to bottom: a yes goes right to an outcome, a no goes down.
   steps: {q, yes: {t, k}} and a final {end: {t, k}}; ids let a scenario light its path. */
function ladder(steps, id) {
  return `<div class="v-lad" data-ladder="${id}">${steps.map((s, i) => s.end
    ? `<div class="v-lad-row"><div class="v-lad-out ${VC(s.end.k)}" data-node="end"><span class="v-lad-k">Otherwise</span><b>${s.end.t}</b></div></div>`
    : `<div class="v-lad-row"><div class="v-lad-q" data-node="q${i}"><span class="v-lad-k">Question ${i + 1}</span><b>${s.q}</b></div><span class="v-lad-yes" data-node="y${i}">yes</span><div class="v-lad-out ${VC(s.yes.k)}" data-node="o${i}"><b>${s.yes.t}</b></div></div><span class="v-lad-no" data-node="n${i}">no</span>`).join("")}</div>`;
}

/* ---------- Composite visuals for the running example ---------- */

/* The portfolio summary screen as a wireframe. mode: desktop | tablet | fixed */
function wireframe(mode) {
  const W = mode === "desktop" ? 400 : 260, H = mode === "fixed" ? 330 : 250;
  const donut = (cx, cy, r) => {
    const parts = [[64, "think", "Equity 64%"], [24.5, "observe", "Debt 24.5%"], [6.5, "act", "Gold 6.5%"], [5, "graph", "Cash 5%"]];
    let off = 0, s = "";
    parts.forEach(([v, k]) => { s += `<circle class="vs-donut sk-${k}" cx="${cx}" cy="${cy}" r="${r}" pathLength="100" stroke-dasharray="${v - 1} ${101 - v}" stroke-dashoffset="${-off + 25}"></circle>`; off += v; });
    return s;
  };
  const legend = (x, y) => [["think", "Equity 64%"], ["observe", "Debt 24.5%"], ["act", "Gold 6.5%"], ["graph", "Cash 5%"]].map(([k, t], i) => `<rect class="fk-${k}" x="${x}" y="${y + i * 15 - 8}" width="8" height="8" rx="2"></rect><text class="vs-m" x="${x + 13}" y="${y + i * 15}">${t}</text>`).join("");
  const line = (x, y, w, h) => `<rect class="vs-card" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"></rect><text class="vs-m" x="${x + 10}" y="${y + 16}">Performance vs benchmark</text>
    <polyline class="vs-series sk-accent" points="${[0, .18, .3, .45, .55, .7, .85, 1].map((p, i) => `${(x + 10 + p * (w - 20)).toFixed(0)},${(y + h - 10 - [10, 16, 13, 22, 20, 27, 24, 30][i] * (h - 30) / 32).toFixed(0)}`).join(" ")}"></polyline>
    <polyline class="vs-series sk-muted is-dash" points="${[0, .3, .55, .8, 1].map((p, i) => `${(x + 10 + p * (w - 20)).toFixed(0)},${(y + h - 10 - [8, 12, 16, 19, 22][i] * (h - 30) / 32).toFixed(0)}`).join(" ")}"></polyline>`;
  const table = (x, y, w, cols) => {
    const rows = [["Holding", "Value", "Weight", "1-year"], ["Infosys", "₹68,52,920", "14.2%", "−6.1%"], ["TCS", "₹55,98,160", "11.6%", "−2.4%"], ["HDFC Bank", "₹43,43,400", "9.0%", "+12.3%"]];
    const cw = (cols || 4) === 4 ? [0, .38, .66, .86] : [0, .55];
    return `<rect class="vs-card" x="${x}" y="${y}" width="${w}" height="74" rx="6"></rect>` + rows.map((r, i) => cw.map((c, j) => `<text class="${i ? "vs-t" : "vs-m"}" x="${x + 10 + c * w}" y="${y + 18 + i * 17}">${r[j]}</text>`).join("")).join("");
  };
  let s = `<rect class="vs-frame" x="1" y="1" width="${W - 2}" height="${H - 2}" rx="12"></rect>
    <text class="vs-h" x="16" y="26">Mehta family</text><text class="vs-m" x="${W - 16}" y="26" text-anchor="end">as of 30 Sep 2026</text>
    <rect class="vs-card" x="14" y="38" width="${mode === "desktop" ? 170 : W - 28}" height="52" rx="6"></rect><text class="vs-m" x="24" y="56">Total value</text><text class="vs-v" x="24" y="78">₹4,82,60,000</text>`;
  if (mode === "desktop") {
    s += donut(232, 64, 20) + legend(270, 50) + line(14, 100, W - 28, 64) + table(14, 172, W - 28);
  } else if (mode === "tablet") {
    s += `<g opacity=".95">${donut(46, 124, 20)}</g>${legend(84, 110)}` + line(14, 152, W - 28, 50).replace(/Performance vs benchmark/, "Performance");
    s += `<g class="vs-clip">${table(14, 210, 380)}</g><rect class="vs-bad" x="${W - 6}" y="206" width="${400 - W}" height="40" rx="4"></rect><text class="vs-badt" x="${W - 12}" y="${H - 6}" text-anchor="end">table runs off the screen</text>`;
  } else {
    s += donut(46, 124, 20) + legend(84, 110) + line(14, 156, W - 28, 56).replace(/Performance vs benchmark/, "Performance");
    s += `<rect class="vs-card" x="14" y="222" width="${W - 28}" height="96" rx="6"></rect><text class="vs-m" x="24" y="240">Top holdings · tap for all</text>` +
      [["Infosys", "14.2%"], ["TCS", "11.6%"], ["HDFC Bank", "9.0%"]].map(([a, b], i) => `<text class="vs-t" x="24" y="${262 + i * 20}">${a}</text><text class="vs-t" x="${W - 24}" y="${262 + i * 20}" text-anchor="end">${b}</text>`).join("");
  }
  return `<svg class="v-wire" viewBox="0 0 ${mode === "tablet" ? 400 : W} ${H}" style="max-width:${mode === "tablet" ? 400 : W}px" aria-hidden="true">${s}</svg>`;
}

/* The SDLC wheel and ADLC loop, drawn small and not clickable */
function miniLifecycles(which = "both") {
  const cell = (svg, t, s) => `<div class="v-mini"><div class="v-mini-svg">${svg}</div><b>${t}</b><span>${s}</span></div>`;
  const out = [];
  if (which !== "adlc") out.push(cell(wheelSvg(SDLC_STAGES, true), "SDLC · 7 stages", "Fixed behaviour. Specify it exactly, test pass/fail, ship."));
  if (which !== "sdlc") out.push(cell(loopSvg(ADLC_STAGES, true), "ADLC · 8 stages", "Probabilistic behaviour. Measure it, gate it, watch it, loop."));
  return `<div class="v-minis">${out.join("")}</div>`;
}

const PATHS = { software: ["q0", "y0", "o0"], agent: ["q0", "n0", "q1", "n1", "end"], mix: ["q0", "n0", "q1", "y1", "o1"] };
function glance() {
  const box2 = (h, a, sa, b, sb) => `<div><h4>${h}</h4><div class="glance-pair"><div><span>Software</span>${a}<p>${sa}</p></div><div><span>Agent</span>${b}<p>${sb}</p></div></div></div>`;
  const svg = inner => `<svg viewBox="0 0 120 60" aria-hidden="true">${inner}</svg>`;
  const squares = (n, bad = []) => Array.from({ length: n }, (_, i) => `<rect x="${8 + (i % 8) * 13}" y="${12 + Math.floor(i / 8) * 13}" width="10" height="10" rx="2" class="fk-${bad.includes(i) ? "bad" : "final"}"></rect>`).join("");
  const bars = [6, 10, 18, 30, 40, 26].map((h, i) => `<rect x="${10 + i * 17}" y="${52 - h}" width="13" height="${h}" rx="2" class="fk-${i < 1 ? "bad" : "accent"}"></rect>`).join("");
  return `<div class="glance" role="list">${[
    box2("How testing works", svg(squares(16)), "every case passes or fails", svg(bars), "a spread of scores"),
    box2("Behaviour over time", svg('<polyline class="vs-series sk-observe" points="8,30 112,30"></polyline>'), "flat until someone deploys", svg('<line class="vs-mark sk-bad" x1="64" x2="64" y1="6" y2="54"></line><polyline class="vs-series sk-accent" points="8,22 40,20 64,21 80,34 112,38"></polyline>'), "drops after a model update"),
    box2("Cost as usage grows", svg('<polyline class="vs-series sk-observe" points="8,50 112,47"></polyline>'), "close to zero per use", svg('<polyline class="vs-series sk-accent" points="8,52 112,10"></polyline>'), "every question costs money"),
    box2("How it's released", svg('<polyline class="vs-series sk-observe" points="8,52 30,52 30,44 50,44 50,10 112,10"></polyline>'), "flag, then everyone, in days", svg('<polyline class="vs-series sk-accent" points="8,52 26,52 26,48 52,48 52,38 80,38 80,10 112,10"></polyline><circle class="fk-accent" cx="52" cy="48" r="3"></circle><circle class="fk-accent" cx="80" cy="38" r="3"></circle>'), "gated stages over weeks"),
  ].map(x => x.replace("<div><h4>", '<div role="listitem"><h4>')).join("")}</div>`;
}

const TERM_RE = /\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g;

function markTerms(html, seen, used) {
  return html.replace(TERM_RE, (_, key, shown) => {
    const k = key.trim().toLowerCase();
    const text = shown || key;
    if (!TERMS[k]) { console.warn("Missing term:", k); return text; }
    if (used && !used.includes(k)) used.push(k);
    if (seen) { if (seen.has(k)) return text; seen.add(k); }
    return `<button class="term" type="button" data-term="${k}" aria-expanded="false">${text}</button>`;
  });
}

let ticking = false;
function onScroll() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    if (!cur) { bar.style.width = "0%"; return; }
    const topH = $("#topbar").offsetHeight + 24;
    const vh = window.innerHeight;
    let active = 0;
    let changed = false;
    cur.secEls.forEach((s, i) => {
      const r = s.getBoundingClientRect();
      if (r.top <= topH) active = i;
      if (r.bottom < vh * 0.6 && r.bottom > 0 && !read.has(s.id)) { read.add(s.id); changed = true; }
    });
    const atEnd = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
    if (atEnd) {
      active = cur.secEls.length - 1;
      cur.secEls.forEach(s => { if (s.getBoundingClientRect().top < vh && !read.has(s.id)) { read.add(s.id); changed = true; } });
    }
    if (changed) store.set("sldc.read", Array.from(read));
    const links = $$("a", rail);
    links.forEach((a, i) => {
      a.classList.toggle("is-active", i === active);
      if (i === active) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current");
      $(".rd", a).hidden = !read.has(cur.sections[i].id);
    });
    const act = links[active];
    if (act) {
      const left = act.offsetLeft - rail.offsetLeft;
      if (left < rail.scrollLeft || left + act.offsetWidth > rail.scrollLeft + rail.clientWidth) rail.scrollLeft = left - 24;
    }
    const activeId = cur.sections[active].id;
    if (activeId !== lastSaved) { lastSaved = activeId; store.set("sldc.last", activeId); }
    const nRead = cur.sections.filter(s => read.has(s.id)).length;
    railCount.innerHTML = `${active + 1} / ${cur.sections.length}<span class="long"> · ${nRead} read</span>`;
    const top = cur.el.offsetTop;
    const span = cur.el.offsetHeight - vh + 80;
    const pct = Math.max(0, Math.min(1, (window.scrollY - top + 80) / Math.max(span, 1)));
    bar.style.width = (pct * 100).toFixed(1) + "%";
  });
}

/* ---------- Lifecycle maps ---------- */

function wheelSvg(stages, mini) {
  const cx = 260, cy = 260, R = 246, r = 118, n = stages.length, step = (Math.PI * 2) / n;
  const pt = (rad, a) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
  const segs = stages.map((s, i) => {
    const a0 = -Math.PI / 2 + i * step, a1 = a0 + step, am = (a0 + a1) / 2;
    const [x0, y0] = pt(R, a0), [x1, y1] = pt(R, a1), [x2, y2] = pt(r, a1), [x3, y3] = pt(r, a0), [lx, ly] = pt((R + r) / 2, am);
    const d = `M${f1(x0)} ${f1(y0)} A${R} ${R} 0 0 1 ${f1(x1)} ${f1(y1)} L${f1(x2)} ${f1(y2)} A${r} ${r} 0 0 0 ${f1(x3)} ${f1(y3)} Z`;
    return `<g class="seg" data-i="${i}"${mini ? "" : ` tabindex="0" role="button" aria-label="Stage ${i + 1}: ${s.name}"`}><path d="${d}"></path><text class="num" x="${f1(lx)}" y="${f1(ly - 10)}" text-anchor="middle">${i + 1}</text><text x="${f1(lx)}" y="${f1(ly + 10)}" text-anchor="middle">${s.name}</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 520 520"${mini ? ' class="is-mini" aria-hidden="true"' : ` role="group" aria-label="SDLC wheel with ${n} stages"`}>${segs}
    <circle class="hub" cx="${cx}" cy="${cy}" r="${r - 10}"></circle>
    <text class="hub-t" x="${cx}" y="${cy - 6}" text-anchor="middle">SDLC</text>
    <text class="hub-s" x="${cx}" y="${cy + 18}" text-anchor="middle">7 stages, clockwise</text>
    <text class="hub-s" x="${cx}" y="${cy + 36}" text-anchor="middle">maintenance feeds planning</text></svg>`;
}

function loopSvg(stages, mini) {
  const id = mini ? "M" : "";
  const cx = 360, cy = 272, rx = 270, ry = 206, hw = 84, hh = 26;
  const subs = ["is an agent needed?", "job, tools, guardrails", "instructions and data", "plan, act, observe", "score many cases", "attack it first", "gates, human approval", "traces, cost, feedback"];
  const pos = stages.map((s, i) => { const a = -Math.PI / 2 + i * (Math.PI / 4); return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
  const edgePt = ([x, y], dx, dy, gap) => {
    const s = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
    const len = Math.hypot(dx, dy);
    return [x + dx * s + (dx / len) * gap, y + dy * s + (dy / len) * gap];
  };
  let edges = "";
  for (let i = 0; i < stages.length - 1; i++) {
    const [a, b] = [pos[i], pos[i + 1]], dx = b[0] - a[0], dy = b[1] - a[1];
    const [x1, y1] = edgePt(a, dx, dy, 3), [x2, y2] = edgePt(b, -dx, -dy, 6);
    edges += `<line class="edge" x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" marker-end="url(#ahLoop${id})"></line>`;
  }
  const m = pos[7], d = pos[1];
  edges += `<path class="edge-back" d="M${f1(m[0] + hw + 3)} ${f1(m[1] + 6)} Q ${cx} ${f1(m[1] + 92)} ${f1(d[0] - hw - 7)} ${f1(d[1] + 6)}" marker-end="url(#ahBack${id})"></path>
    <text class="lbl-accent" x="${cx}" y="${f1(m[1] + 74)}" text-anchor="middle">findings go back to design</text>`;
  const nodes = stages.map((s, i) => { const [x, y] = pos[i];
    return `<g class="node" data-i="${i}"${mini ? "" : ` tabindex="0" role="button" aria-label="Stage ${i + 1}: ${s.name}"`}><rect x="${f1(x - hw)}" y="${f1(y - hh)}" width="${hw * 2}" height="${hh * 2}" rx="10"></rect><text class="ttl" x="${f1(x)}" y="${f1(y - 3)}" text-anchor="middle"><tspan class="nn">${i + 1} · </tspan>${s.short}</text><text class="sub" x="${f1(x)}" y="${f1(y + 15)}" text-anchor="middle">${subs[i]}</text></g>`; }).join("");
  return `<svg viewBox="0 0 720 544"${mini ? ' class="is-mini" aria-hidden="true"' : ` role="group" aria-label="ADLC loop with ${stages.length} stages"`}>
    <defs><marker id="ahLoop${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 L10 5 L0 10 z"></path></marker>
    <marker id="ahBack${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-accent" d="M0 0 L10 5 L0 10 z"></path></marker></defs>
    ${edges}
    <text class="hub-t" x="${cx}" y="${cy + 28}" text-anchor="middle">ADLC</text>
    <text class="hub-s" x="${cx}" y="${cy + 52}" text-anchor="middle">8 stages, clockwise, never finished</text>
    ${nodes}</svg>`;
}

function setupMap(root, stages, kind) {
  const svgHost = $("[data-svg]", root), detail = $("[data-detail]", root);
  svgHost.innerHTML = kind === "sdlc" ? wheelSvg(stages) : loopSvg(stages);
  const items = $$(kind === "sdlc" ? ".seg" : ".node", svgHost);
  const state = { i: 0, bad: false };
  function draw(focusSwitch) {
    const s = stages[state.i];
    items.forEach((g, i) => { g.classList.toggle("is-sel", i === state.i && !state.bad); g.classList.toggle("is-bad", i === state.i && state.bad); g.setAttribute("aria-pressed", i === state.i); });
    detail.classList.toggle("is-bad", state.bad);
    const owner = `Owner: ${s.owner.join(" and ")}`;
    const body = state.bad
      ? `<div class="wrong-h"><span class="kind k-bad">Goes wrong</span><b>${s.wrong.title}</b></div><p>${s.wrong.what}</p>${timeline(s.wrong.timeline)}<p><strong>How it's caught.</strong> ${s.wrong.caught}</p>`
      : `<p>${s.what[0]}</p>${dl([["What the PM does", s.pm.slice(0, 3).join(". ") + "."], ["What it produces", s.output.join(" · ")]])}`;

      <button class="switch" type="button" aria-pressed="${state.bad}" data-act="bad"><span class="knob"></span>What could go wrong</button></div>
      <h3>${s.name}</h3>${body}

    if (focusSwitch) $("[data-act=bad]", detail).focus();
  }
  function pick(i) { state.i = i; draw(); }
  items.forEach((g, i) => {
    g.addEventListener("click", () => pick(i));
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(i); } });
  });
  detail.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (b) {
      if (b.dataset.act === "bad") { state.bad = !state.bad; draw(true); }
      if (b.dataset.act === "prev" && state.i > 0) { state.i--; draw(); $("[data-act=prev]", detail).disabled ? $("[data-act=next]", detail).focus() : $("[data-act=prev]", detail).focus(); }
      if (b.dataset.act === "next" && state.i < stages.length - 1) { state.i++; draw(); $("[data-act=next]", detail).disabled ? $("[data-act=prev]", detail).focus() : $("[data-act=next]", detail).focus(); }
      return;
    }
    const j = e.target.closest("[data-jump]");
    if (j) { e.preventDefault(); document.getElementById(j.dataset.jump).scrollIntoView(); history.replaceState(null, "", "#" + j.dataset.jump); }
  });
  draw();
}

/* ---------- Simulated trace ---------- */
(function trace() {
  const root = $("#traceDemo");
  const q = k => $(`[data-t=${k}]`, root);
  const steps = TRACE.steps;
  let n = 0, prev = 0;
  function draw() {
    const shown = steps.slice(0, n);
    q("timeline").innerHTML = shown.length
      ? shown.map((s, i) => `<div class="step ${s.cls || ""}${i === n - 1 ? " s-current" : ""}${i < prev || n < prev ? " s-still" : ""}"><div class="step-h"><span class="step-n">Step ${i + 1}</span><span class="kind ${s.kind}">${s.label}</span><span class="step-t">${s.title}</span></div>${s.html}</div>`).join("")
      : `<p class="demo-empty">Press <strong>Next step</strong> to start the run. Each step shows what the agent thought or did, in order.</p>`;
    const lines = shown.flatMap(s => s.log);
    q("log").innerHTML = lines.length ? log(lines).replace(/^<div class="log" role="log">|<\/div>$/g, "") : `<div><span class="t">--.--</span>  waiting for run_start</div>`;
    const sum = shown.reduce((a, s) => ({ lat: a.lat + s.dt, tok: a.tok + s.tokens, cost: a.cost + s.cost }), { lat: 0, tok: 0, cost: 0 });
    q("lat").textContent = sum.lat.toFixed(2) + " s";
    q("cost").textContent = "$" + sum.cost.toFixed(3);
    q("tok").textContent = sum.tok.toLocaleString("en-US");
    q("spans").textContent = lines.filter(l => ["e-model", "e-tool", "e-bad"].includes(l[1])).length;
    const sp = TRACE.spans.filter(x => x.step <= n);
    q("wf").innerHTML = sp.length ? waterfall(sp, 4.52, [0, 1, 2, 3, 4]) : `<p class="demo-empty small">Spans appear here as the run progresses.</p>`;
    q("n").textContent = n;
    const last = shown[n - 1];
    q("phase").textContent = !last ? "Ready" : n === steps.length ? "Run complete · waiting for the RM to review the draft" : `${last.label} · ${last.title}`;
    $$(".phase", root).forEach(ph => ph.classList.toggle("is-on", !!last && ph.classList.contains(last.phase)));
    q("back").disabled = n === 0;
    q("next").disabled = n === steps.length;
    q("reset").disabled = n === 0;
    const tl = q("timeline"); tl.scrollTop = tl.scrollHeight;
    const lg = q("log"); lg.scrollTop = lg.scrollHeight;
    prev = n;
  }
  root.addEventListener("click", e => {
    const b = e.target.closest("button[data-t]");
    if (!b) return;
    if (b.dataset.t === "next" && n < steps.length) n++;
    if (b.dataset.t === "back" && n > 0) n--;
    if (b.dataset.t === "reset") n = 0;
    draw();
    if (b.disabled) q(n === 0 ? "next" : "back").focus();
  });
  draw();
})();

/* ---------- Parallel tracks ---------- */
(function tracks() {
  const root = $("[data-tracks]");
  const note = $("[data-tnote]");
  const all = $$(".tstage", root);
  const nameOf = id => { const s = SDLC_STAGES.find(x => x.id === id) || ADLC_STAGES.find(x => x.id === id); return s.short || s.name; };
  const side = id => (id.startsWith("sdlc") ? "SDLC" : "ADLC");
  function pick(id) {
    const link = TRACK_LINKS[id];
    all.forEach(b => {
      const sel = b.dataset.id === id, match = link.to.includes(b.dataset.id);
      b.classList.toggle("is-sel", sel);
      b.classList.toggle("is-match", match);
      b.setAttribute("aria-pressed", sel);
    });
    drawLinks(id);
    note.innerHTML = markTerms(`<span class="pair">${side(id)} · ${nameOf(id)} ↔ ${side(link.to[0])} · ${link.to.map(nameOf).join(" + ")}</span><h3>${link.h}</h3><p>${link.note}</p>`, null);
  }
  root.addEventListener("click", e => { const b = e.target.closest(".tstage"); if (b) pick(b.dataset.id); });
  /* Connector lines between matched stages, drawn in the gap between the two tracks. */
  let selected = SDLC_STAGES[0].id;
  function drawLinks(id) {
    if (id) selected = id;
    let svg = $(".v-links", root);
    if (!svg) { svg = document.createElementNS(NS, "svg"); svg.setAttribute("class", "v-links"); svg.setAttribute("aria-hidden", "true"); root.prepend(svg); }
    const box = root.getBoundingClientRect();
    if (!box.width) return;
    const at = (bid, side) => { const r = $(`.tstage[data-id="${bid}"]`, root).getBoundingClientRect(); return [side === "r" ? r.right - box.left : r.left - box.left, r.top - box.top + r.height / 2]; };
    let paths = "";
    SDLC_STAGES.forEach(s => TRACK_LINKS[s.id].to.forEach(to => {
      const [x1, y1] = at(s.id, "r"), [x2, y2] = at(to, "l"), mx = (x1 + x2) / 2;
      const on = selected === s.id || selected === to;
      paths += `<path class="${on ? "on" : ""}" d="M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}"></path>`;
    }));
    svg.innerHTML = paths;
  }
  window.addEventListener("resize", () => drawLinks());
  document.addEventListener("guide:shown", e => { if (e.detail === "compare") drawLinks(); });
  pick(SDLC_STAGES[0].id);
})();

/* Site-wide search, after the one in how-ai-agents-work and pm-fundamentals.
   A Search button in the top bar (or / and Ctrl/Cmd+K) opens a dialog over the page.
   The index is built from the rendered modules the first time search opens: one entry per
   section and sub-section, plus every glossary term. Picking a result opens the module,
   scrolls to the section and highlights the matched words. */
(function search() {
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MAX = 30;
  const SUGGEST = ["acceptance criteria", "feature flag", "rollback", "golden dataset", "prompt injection", "p95", "red-teaming", "UAT"];
  const KIND = { Stage: "k-call", Section: "k-res", Term: "k-think" };

  /* ---------- Dialog ---------- */
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "gs-btn";
  btn.id = "gsBtn";
  btn.setAttribute("aria-label", "Search the guide");
  btn.innerHTML = SEARCH_ICON + '<span class="gs-l">Search</span><kbd>/</kbd>';
  $("#themeBtn").before(btn);

  const ov = document.createElement("div");
  ov.className = "gs-ov";
  ov.hidden = true;
  ov.innerHTML = `<div class="gs-box" role="dialog" aria-modal="true" aria-label="Search the guide">
      <div class="gs-top">${SEARCH_ICON}<label class="sr" for="gsIn">Search the guide</label>
        <input class="gs-in" id="gsIn" type="search" autocomplete="off" spellcheck="false" placeholder="Search stages, sections and terms" role="combobox" aria-expanded="true" aria-controls="gsList" aria-autocomplete="list">
        <button type="button" class="gs-x" id="gsClose">Esc</button></div>
      <div class="gs-meta" id="gsMeta" aria-live="polite"></div>
      <ul class="gs-list" id="gsList" role="listbox" aria-label="Results"></ul>
      <div class="gs-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
    </div>`;
  document.body.appendChild(ov);
  const input = $("#gsIn"), list = $("#gsList"), meta = $("#gsMeta");

  /* ---------- Index ---------- */
  let INDEX = null;
  /* Replace every tag with a space so text from neighbouring blocks doesn't run together. */
  const decoder = document.createElement("textarea");
  const textOf = node => { decoder.innerHTML = node.innerHTML.replace(/<[^>]+>/g, " "); return decoder.value.replace(/\s+/g, " ").replace(/ ([.,;:!?)])/g, "$1").trim(); };
  function buildIndex() {
    const entries = [];
    MODULES.forEach((m, mi) => {
      m.sections.forEach(s => {
        const sec = document.getElementById(s.id).cloneNode(true);
        $$("svg, .quiz-opts, .quiz-fb, .quiz-score, details.terms, .takeaway .k, [data-detail], [data-tnote], .verdict, .controls, .statusbar", sec).forEach(n => n.remove());
        const h = textOf($("h2", sec));
        const kind = /^Stage /.test(s.eyebrow) ? "Stage" : "Section";
        const where = `Module ${mi + 1} · ${m.tab} › ${s.eyebrow.split(" · ")[0]}`;
        let sub = "", buf = [];
        const flush = () => { const t = buf.join(" ").trim(); if (t) entries.push({ kind, mod: m.id, sec: s.id, where, h, s: sub, t }); buf = []; };
        Array.from(sec.children).forEach(ch => {
          if (ch.matches("h3.sub")) { flush(); sub = textOf(ch); return; }
          buf.push(textOf(ch));
        });
        flush();
      });
    });
    Object.entries(TERMS).forEach(([key, [name, def]]) => entries.push({ kind: "Term", key, where: "Glossary", h: name, s: "", t: def }));
    return entries;
  }

  /* ---------- Matching ---------- */
  function run(q) {
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return { words, results: [] };
    const phrase = words.join(" ");
    const out = [];
    INDEX.forEach((e, order) => {
      const h = e.h.toLowerCase(), s = e.s.toLowerCase(), t = e.t.toLowerCase();
      let score = 0;
      for (const w of words) {
        const inH = h.includes(w), inS = s.includes(w), n = t.split(w).length - 1;
        if (!inH && !inS && !n) return;
        score += (inH ? 8 : 0) + (inS ? 5 : 0) + Math.min(n, 3);
        if (e.kind === "Term" && inH) score += 6;
        if (new RegExp("\\b" + reEsc(w) + "\\b").test(h + " " + s)) score += 3;
      }
      if (words.length > 1 && (h.includes(phrase) || s.includes(phrase) || t.includes(phrase))) score += 6;
      if (e.kind === "Term" && h === phrase) score += 20;
      out.push({ e, score, order });
    });
    out.sort((a, b) => b.score - a.score || a.order - b.order);
    return { words, results: out.slice(0, MAX) };
  }
  const mark = (text, words) => words.reduce((html, w) => html.replace(new RegExp("\\b(" + reEsc(esc(w)) + ")", "gi"), "<mark>$1</mark>"), esc(text));
  function snippet(text, words) {
    const lower = text.toLowerCase();
    let at = -1;
    for (const w of words) { const i = lower.indexOf(w); if (i >= 0 && (at < 0 || i < at)) at = i; }
    let start = Math.max(0, at - 70);
    const end = Math.min(text.length, start + 190);
    if (start > 0) { const sp = text.indexOf(" ", start); if (sp > 0 && sp < at) start = sp + 1; }
    return (start > 0 ? "…" : "") + mark(text.slice(start, end), words) + (end < text.length ? "…" : "");
  }

  /* ---------- Rendering ---------- */
  let results = [], words = [], active = -1, lastFocus = null;
  function render() {
    const q = input.value.trim();
    if (!q) {
      results = []; active = -1;
      meta.textContent = `${INDEX.length} sections and terms across 3 modules`;
      list.innerHTML = `<li class="gs-empty"><p>Try one of these:</p><div class="chips">${SUGGEST.map(x => `<button type="button" class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join("")}</div></li>`;
      input.removeAttribute("aria-activedescendant");
      return;
    }
    ({ words, results } = run(q));
    active = results.length ? 0 : -1;
    if (!results.length) {
      meta.textContent = "";
      list.innerHTML = `<li class="gs-empty">No matches for “${esc(q)}”. Try a shorter or different word.</li>`;
      input.removeAttribute("aria-activedescendant");
      return;
    }
    meta.textContent = results.length === MAX ? `Top ${MAX} results` : `${results.length} result${results.length === 1 ? "" : "s"}`;
    list.innerHTML = results.map(({ e }, i) => `<li role="option" id="gsOpt${i}" aria-selected="${i === active}"><a href="#${e.sec || ""}" tabindex="-1" data-i="${i}">
        <span class="gs-row"><span class="kind ${KIND[e.kind]}">${e.kind}</span><span class="gs-where">${esc(e.where)}</span></span>
        <span class="gs-h">${mark(e.h, words)}${e.s ? ` <span>› ${mark(e.s, words)}</span>` : ""}</span>
        <span class="gs-snip">${snippet(e.t, words)}</span></a></li>`).join("");
    input.setAttribute("aria-activedescendant", "gsOpt0");
  }
  function setActive(i) {
    const opts = $$('[role="option"]', list);
    if (!opts.length) return;
    active = (i + opts.length) % opts.length;
    opts.forEach((o, k) => o.setAttribute("aria-selected", String(k === active)));
    opts[active].scrollIntoView({ block: "nearest" });
    input.setAttribute("aria-activedescendant", "gsOpt" + active);
  }

  /* ---------- Going to a result ---------- */
  function clearHits() {
    $$("mark.gs-hit").forEach(m => { const p = m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize(); });
  }
  function markHits(root, ws) {
    const re = new RegExp("\\b(" + ws.filter(w => w.length >= 2 || ws.length === 1).map(reEsc).join("|") + ")", "gi");
    const nodes = [];
    const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: n => (n.parentElement.closest("svg, script, style, .quiz-fb, mark") || !n.nodeValue.trim() ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
    });
    while (walk.nextNode()) nodes.push(walk.currentNode);
    nodes.forEach(node => {
      const text = node.nodeValue;
      re.lastIndex = 0;
      if (!re.test(text)) return;
      re.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let pos = 0, m;
      while ((m = re.exec(text))) {
        if (m.index > pos) frag.appendChild(document.createTextNode(text.slice(pos, m.index)));
        const mk = document.createElement("mark");
        mk.className = "gs-hit";
        mk.textContent = m[0];
        frag.appendChild(mk);
        pos = m.index + m[0].length;
      }
      if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
      node.parentNode.replaceChild(frag, node);
    });
  }
  function visible(el) { return el && el.offsetParent !== null; }
  function go(i) {
    const r = results[i];
    if (!r) return;
    const e = r.e;
    close(false);
    clearHits();
    const smooth = { behavior: reduceMotion ? "auto" : "smooth", block: "center" };
    if (e.kind === "Term") {
      const order = [cur, ...MODULES.filter(m => m !== cur)].filter(Boolean);
      let btn = null, mod = null;
      for (const m of order) { btn = $(`.term[data-term="${e.key}"]`, m.el); if (btn) { mod = m; break; } }
      if (!btn) return;
      const sec = btn.closest(".sec");
      setModule(mod.id, { section: sec.id });
      if (!visible(btn)) { const d = btn.closest("details"); if (d) d.open = true; }
      btn.scrollIntoView(smooth);
      setTimeout(() => { btn.focus({ preventScroll: true }); openPop(btn); }, reduceMotion ? 0 : 350);
      return;
    }
    setModule(e.mod, { section: e.sec });
    const sec = document.getElementById(e.sec);
    let scope = sec;
    if (e.s) { const h3 = $$("h3.sub", sec).find(h => textOf(h) === e.s); if (h3) scope = h3; }
    markHits(sec, words);
    const hits = $$("mark.gs-hit", sec).filter(visible);
    const inScope = scope === sec ? hits : hits.filter(m => scope.compareDocumentPosition(m) & Node.DOCUMENT_POSITION_FOLLOWING);
    const target = inScope[0] || hits[0] || scope;
    target.scrollIntoView(smooth);
    const flash = target.closest("p, li, td, .box, .ex, .wrong, h2, h3, h4, .quiz") || target;
    flash.classList.add("gs-flash");
    setTimeout(() => flash.classList.remove("gs-flash"), 1800);
  }

  /* ---------- Open and close ---------- */
  function open(q) {
    if (!INDEX) INDEX = buildIndex();
    closePop();
    lastFocus = document.activeElement;
    ov.hidden = false;
    document.documentElement.classList.add("gs-open");
    if (typeof q === "string") input.value = q;
    render();
    input.focus();
    input.select();
  }
  function close(restore = true) {
    if (ov.hidden) return;
    ov.hidden = true;
    document.documentElement.classList.remove("gs-open");

  window.openSearch = open;

  btn.addEventListener("click", () => open());
  document.addEventListener("click", e => { if (e.target.closest("[data-search-open]")) open(); });
  $("#gsClose").addEventListener("click", () => close());
  ov.addEventListener("mousedown", e => { if (e.target === ov) close(); });
  input.addEventListener("input", render);
  list.addEventListener("click", e => {
    const chip = e.target.closest(".chip[data-q]");
    if (chip) { input.value = chip.dataset.q; render(); input.focus(); return; }

    if (!a) return;
    e.preventDefault();
    go(+a.dataset.i);
  });
  list.addEventListener("mousemove", e => { const a = e.target.closest("a[data-i]"); if (a && +a.dataset.i !== active) setActive(+a.dataset.i); });
  ov.addEventListener("keydown", e => {
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); }

    else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
    else if (e.key === "Enter" && e.target === input && active >= 0) { e.preventDefault(); go(active); }
    else if (e.key === "Tab") { e.preventDefault(); (document.activeElement === input ? $("#gsClose") : input).focus(); }
  });
  document.addEventListener("keydown", e => {
    const typing = e.target.closest && e.target.closest("input, textarea, select, [contenteditable]");
    if ((e.key === "k" || e.key === "K") && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ov.hidden ? open() : close(); }
    else if (e.key === "/" && !typing && ov.hidden && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); open(); }
  });
})();

</script>
